function ean13Modulos(c) {
  const inv = bits => [...bits].map(b => b === "1" ? "0" : "1").join("");
  const paridad = EAN_PARIDAD[Number(c[0])];
  const izq = [...c.slice(1, 7)].map((d, i) => {
    const l = EAN_L[Number(d)];
    return paridad[i] === "L" ? l : [...inv(l)].reverse().join("");

  const der = [...c.slice(7)].map(d => inv(EAN_L[Number(d)])).join("");
  return "101" + izq + "01010" + der + "101";

  try { detector = await crearLector(); }
  catch {
    if (turno === scanTurno) msg.textContent = "No se pudo preparar el lector de la cámara. La primera vez necesita internet; revisa la conexión y vuelve a intentar.";
    return;
  }
  if (turno !== scanTurno) return;
  msg.textContent = inicio;
  let anterior = "", ultimo = "", ultimoVisto = 0;
  const leer = async () => {
    if (turno !== scanTurno) return;
    let codigo = "";
    try {
      if (video.readyState >= 2) {
        const r = await detector.detect(video);
        codigo = (r[0] && r[0].rawValue || "").trim();
      }
    } catch {}
    if (turno !== scanTurno) return;
    const ahora = Date.now();
    // dos lecturas iguales seguidas evitan lecturas falsas; el mismo código vale otra vez solo si salió de la cámara
    if (ultimo && codigo !== ultimo && ahora - ultimoVisto > 1500) ultimo = "";
    if (codigo && codigo === ultimo) ultimoVisto = ahora;
    if (codigo && codigo === anterior && codigo !== ultimo) {
      ultimo = codigo;
      ultimoVisto = ahora;
      scanAviso();
      const r = onCodigo(codigo);
      if (r === false) { dialogo.close(); return; }
      msg.textContent = r;
    }
    anterior = codigo;
    scanTimer = setTimeout(leer, 120);
  };
  leer();
}

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || !usuarioActual() || document.querySelector("dialog[open]")) return;

async function etqImprimir(btn) {
  if (!exigir("producto.editar", "crear etiquetas")) return;
  const msg = $("#etqMsg");
  msg.hidden = true;
  const elegidas = etqTodas().filter(f => etq.cant.get(etqClave(f.p, f.v)) > 0).sort(etqOrden);
  if (!elegidas.length) return;
  const malo = elegidas.find(f => etqCodigo(f) && !barraModulos(etqCodigo(f).trim()));
  if (malo) {
    msg.textContent = `El código de «${etqNombre(malo)}» tiene tildes o ñ y no se puede imprimir. Cámbialo en el producto.`;
    msg.hidden = false;
    return;
  }
  const total = elegidas.reduce((a, f) => a + etq.cant.get(etqClave(f.p, f.v)), 0);
  if (total > 300 && !confirm("Vas a imprimir " + total + " etiquetas. ¿Continuar?")) return;
  btn.disabled = true;
  try {
    // los códigos que faltan se guardan antes de imprimir, para que la etiqueta impresa ya funcione al vender
    const usados = codigosUsados(), cambios = new Map(), hoy = new Date().toISOString();
    for (const f of elegidas) {
      if (etqCodigo(f)) continue;
      const c = cambios.get(f.p.id) || { actualizado: hoy };
      if (f.v) {
        c.variantes = c.variantes || f.p.variantes.map(v => ({ ...v }));
        c.variantes.find(v => v.id === f.v.id).codigo = nuevoCodigoBarras(usados);
      } else c.codigo = nuevoCodigoBarras(usados);
      cambios.set(f.p.id, c);
    }
    for (const [id, c] of cambios) await patchProduct(id, c);
    const claves = elegidas.flatMap(f => Array(etq.cant.get(etqClave(f.p, f.v))).fill(etqClave(f.p, f.v)));
    const actuales = new Map(etqTodas().map(f => [etqClave(f.p, f.v), f]));
    const lista = claves.map(k => actuales.get(k)).map(f => ({ ...f, ...codigoActual(f, cambios) }));
    store.set("mostrador.etiquetas", { tam: etq.tam, precio: etq.precio });
    const ancho = etq.tam === "a4" ? "210mm" : etq.tam === "e50" ? "50mm" : etq.tam === "e50x2" ? ETQ_ROLLO2.anchoPagina + "mm" : (S.settings.papel === "58" ? 58 : 80) + "mm";
    if (canPrintLocally()) printFrame(etiquetasHtml(lista, etq.tam, etq.precio, false), ancho, btn);
    else await saveFile("etiquetas.html", etiquetasHtml(lista, etq.tam, etq.precio, true));
    etqLista();
    if (cambios.size) toast("Códigos nuevos guardados");
  } catch (err) {
    msg.textContent = failMsg(err);
    msg.hidden = false;
  } finally {
    if (!printingFrame) btn.disabled = false;
    etqTotal();
  }
}

function pagoResumen(notes) {

// buscador de productos de Nueva venta y de Cotizaciones
function productMatches(text) {
  const q = norm(text), palabras = palabrasDe(text);
  if (!q) return [];
  const res = [], otros = [];
  S.products.forEach(p => {
    const hay = productoTexto(p);
    if (tieneTodas(hay, palabras)) res.push({ p, s: 1 + (hay.startsWith(q) ? 0.5 : 0) + (hay.includes(q) ? 0.2 : 0) });
    else otros.push(p);
  });
  // el parecido (errores de tipeo) solo se calcula si hace falta y el catálogo no es enorme
  if (res.length < 8 && S.products.length <= CATALOGO_GRANDE) {
    otros.forEach(p => {
      const s = similarity({ nombre: text }, p);
      if (s >= 0.35) res.push({ p, s });
    });
  }
  return res.sort((a, b) => b.s - a.s).slice(0, 8);
}

async function emitNote(btn) {

  const items = draft.items.filter(i => n2(i.cant) > 0).map(i => {
    const linea = { ...i, cant: n2(i.cant), precio: n2(i.precio) };
    // el costo se guarda con la venta: si después cambia, la ganancia de esta venta no se mueve
    const p = i.productId && S.products.find(x => x.id === i.productId);
    if (p && tieneCosto(p)) linea.costo = n2(p.costo); else delete linea.costo;
    return linea;
  });
  if (!items.length) return;
  btn.disabled = true;
  const fromQuote = draft.cotizacionId;
  const note = {
    id: uid(), folio: nextFolio(), fecha: new Date().toISOString(),
    cliente: draft.cliente.trim(), doc: draft.doc.trim(), obs: draft.obs.trim(), pago: draft.pago || PAGO_INICIAL,
    items, total: Math.round(items.reduce((a, i) => a + i.cant * i.precio, 0) * 100) / 100, estado: "emitida",
  };
  try {
    await flushPendingStock();
    note.vendedorId = usuarioActual()?.id;
    note.vendedorNombre = usuarioActual()?.nombre;
    if (usaTransacciones()) {
      const r = await fbMovimiento({ deltas: deltasDe(items, -1), nota: note });
      note.id = r.id; note.folio = r.folio;
    } else {
      const freshNotes = await readNotes();
      note.folio = nextFreeFolio(freshNotes);
      saleAdjusting = true;
      const changed = await adjustStock(items, -1);
      try {
        const latestNotes = await readNotes();
        if (latestNotes.some(n => n2(n.folio) === n2(note.folio))) note.folio = nextFreeFolio(latestNotes);
        await putNote(note);
      }
      catch (err) {
        await restoreProducts(changed);
        try { await deleteNote(note.id); } catch {}
        throw err;
      }
      saleAdjusting = false;
    }
    // la cotización de la que salió la venta queda marcada como vendida
    if (fromQuote) { try { await patchQuote(fromQuote, { estado: "vendida", notaId: note.id, notaFolio: note.folio }); } catch {} }
    draft = blankDraft(); saveDraft();

}
async function readNotes() {
  if (db && db.lastNotes) return db.lastNotes();
  if (db) { const snap = await db.collection("notes").get(); return snap.docs.map(d => ({ id: d.id, ...d.data() })); }
  return [...mem.notes.values()].map(n => ({ ...n }));
}
function nextFreeFolio(notes) {
  const used = new Set(notes.map(n => n2(n.folio)));
  let folio = notes.reduce((m, n) => Math.max(m, n2(n.folio)), 0) + 1;
  while (used.has(folio)) folio++;
  return folio;
}
async function restoreProducts(snapshots) {
  for (const p of snapshots) {
    const body = { ...p }; delete body.id;
    if (db) await db.collection("products").doc(p.id).set(body);
    else { mem.products.set(p.id, { ...p }); syncMem(); }
  }
}
async function adjustStock(items, sign) {
  const byKey = {};
  items.forEach(i => { if (i.productId) {const key=i.productId+":"+(i.variantId||"");byKey[key]=(byKey[key]||0)+n2(i.cant);} });
  const snapshots = [];
  for (const key of Object.keys(byKey)) {
    const [id, vid] = key.split(":"), p = await readProduct(id);
    if (!p || (vid && !(p.variantes || []).some(v => v.id === vid))) throw new Error("Producto o variante no disponible");
  }
  try {
    for (const [key, c] of Object.entries(byKey)) {
      const [id, vid] = key.split(":"), p = await readProduct(id);
      snapshots.push(structuredClone(p));
      if (vid) {
        const v = p.variantes.find(x => x.id === vid);
        v.stock = Math.round((n2(v.stock) + sign * c) * 1000) / 1000; p.stock = totalStock(p);
        await patchProduct(id, { variantes: p.variantes, stock: p.stock, actualizado: new Date().toISOString() });
      } else {
        p.stock = Math.round((n2(p.stock) + sign * c) * 1000) / 1000;
        await patchProduct(id, { stock: p.stock, actualizado: new Date().toISOString() });
      }
    }
  } catch (err) { await restoreProducts(snapshots); throw err; }
  return snapshots;
}

// ---------- Firebase: venta, anulación y conteo, todo junto o nada ----------
// Con internet va en una transacción: si otro equipo cambió el mismo producto o tomó el mismo folio,
// Firebase la repite con los datos nuevos, así nunca se pisan el stock ni se repite el número de nota.
// Sin internet no hay transacciones: va en un lote, que también se guarda entero o nada y se envía al volver la conexión.
const usaTransacciones = () => !!(fbMode && fb && fb.negocioId && db);
const sinRed = e => !navigator.onLine || /unavailable|deadline-exceeded/.test(String((e && e.code) || ""));
const FOLIO_ID = folio => "folio-" + folio;
function deltasDe(items, sign) {
  const deltas = new Map();
  items.forEach(i => {
    if (!i.productId) return;
    const key = i.productId + ":" + (i.variantId || "");
    deltas.set(key, (deltas.get(key) || 0) + sign * n2(i.cant));
  });
  return deltas;
}
// agrupa los cambios por producto: Map(id → [{ vid, d }])
function deltasPorProducto(deltas) {
  const porId = new Map();
  for (const [key, d] of deltas) {
    const [id, vid] = key.split(":");
    if (!porId.has(id)) porId.set(id, []);
    porId.get(id).push({ vid, d });
  }
  return porId;
}
// calcula el stock nuevo de un producto leído; piso0 = el conteo manual no baja de cero
function parcheStock(p, cambios, piso0) {
  const r = x => Math.round(x * 1000) / 1000;
  const ajusta = (actual, d) => piso0 ? Math.max(0, r(n2(actual) + d)) : r(n2(actual) + d);
  const patch = { actualizado: new Date().toISOString() };
  if (cambios.some(c => c.vid)) {
    const variantes = (p.variantes || []).map(v => ({ ...v }));
    for (const c of cambios) {
      const v = variantes.find(x => x.id === c.vid);
      if (!v) throw new Error("Producto o variante no disponible");
      v.stock = ajusta(v.stock, c.d);
    }
    patch.variantes = variantes;
    patch.stock = totalStock({ variantes });
  } else {
    patch.stock = ajusta(p.stock, cambios.reduce((a, c) => a + c.d, 0));
  }
  return patch;
}
// deltas: Map("producto:variante" → cambio). nota: venta nueva. anular: nota que se anula.
// Devuelve el id y el folio con que quedó guardada la venta.
async function fbMovimiento({ deltas, nota = null, anular = null, piso0 = false, soloEnLinea = false }) {
  if (soloEnLinea && !navigator.onLine) throw Object.assign(new Error("Sin conexión"), { code: "unavailable" });
  const { F, fs } = fb, base = "negocios/" + fb.negocioId + "/";
  const prodRef = id => F.doc(fs, base + "products/" + id);
  const porId = deltasPorProducto(deltas);
  const anuladaEn = new Date().toISOString();
  if (navigator.onLine) {
    try {
      // el folio parte de la nota más alta del servidor; la transacción confirma que nadie lo tomó
      let desde = 0;
      if (nota) {
        const ult = await db.lastNotes();
        desde = Math.max(ult[0] ? n2(ult[0].folio) : 0, ...S.notes.map(n => n2(n.folio))) + 1;
      }
      return await F.runTransaction(fs, async tx => {
        // Firebase exige hacer todas las lecturas antes de escribir
        let folio = desde, notaRef = null;
        if (nota) {
          for (let intento = 0; ; intento++) {
            notaRef = F.doc(fs, base + "notes/" + FOLIO_ID(folio));
            if (!(await tx.get(notaRef)).exists()) break;
            if (intento > 50) throw new Error("No se encontró un número de nota libre");
            folio++;
          }
        }
        let anularRef = null;
        if (anular) {
          anularRef = F.doc(fs, base + "notes/" + anular.id);
          const s = await tx.get(anularRef);
          if (!s.exists()) throw Object.assign(new Error("La nota ya no existe."), { aviso: "Esa nota ya no existe." });
          if (s.data().estado === "anulada") throw Object.assign(new Error("Ya anulada"), { aviso: "Esa nota ya fue anulada en otro equipo; el stock no se devolvió dos veces." });
        }
        const parches = [];
        for (const [id, cambios] of porId) {
          const s = await tx.get(prodRef(id));
          if (!s.exists()) throw new Error("Producto o variante no disponible");
          parches.push([id, parcheStock(s.data(), cambios, piso0)]);
        }
        parches.forEach(([id, patch]) => tx.update(prodRef(id), patch));
        if (nota) { const body = { ...nota, folio }; delete body.id; tx.set(notaRef, body); }
        if (anular) tx.update(anularRef, { estado: "anulada", anulada: anuladaEn });
        return { id: notaRef ? notaRef.id : null, folio };
      });
    } catch (e) { if (!sinRed(e) || soloEnLinea) throw e; }
  }
  // sin internet: lote con lo que hay en este equipo. El folio puede coincidir con el de otro equipo
  // que también vendió sin internet, pero ninguna nota se pierde (cada una tiene su propio id).
  // El stock simple se suma con increment, que Firebase combina con lo de otros equipos.
  // Las tallas viven en una lista que no se puede sumar por partes: escribir la lista de este equipo
  // borraría lo que vendió otro, así que ese cambio espera en una cola y se aplica con transacción al volver internet.
  const batch = F.writeBatch(fs);
  const enCola = new Map();
  for (const [id, cambios] of porId) {
    if (cambios.some(c => c.vid)) { cambios.forEach(c => enCola.set(id + ":" + (c.vid || ""), c.d)); continue; }
    batch.update(prodRef(id), { stock: F.increment(Math.round(cambios.reduce((a, c) => a + c.d, 0) * 1000) / 1000), actualizado: new Date().toISOString() });
  }
  if (enCola.size) {
    const cola = pendLeer();
    cola.push({ id: uid(), nid: fb.negocioId, deltas: [...enCola], piso0 });
    pendGuardar(cola);
    toast("Sin internet: el stock por talla se actualizará al volver la conexión");
  }
  let r = { id: null, folio: 0 };
  if (nota) {
    r = { id: nota.id, folio: nextFolio() };
    const body = { ...nota, folio: r.folio }; delete body.id;
    batch.set(F.doc(fs, base + "notes/" + nota.id), body);
  }
  if (anular) {
    if (anular.estado === "anulada") throw Object.assign(new Error("Ya anulada"), { aviso: "Esa nota ya estaba anulada." });
    batch.update(F.doc(fs, base + "notes/" + anular.id), { estado: "anulada", anulada: anuladaEn });
  }
  if (porId.size > enCola.size || nota || anular) await fbWrite(batch.commit());
  return r;
}
// cola de cambios de stock por talla hechos sin internet (sobrevive si se cierra la app)
const PEND_KEY = "mostrador.stockPendiente";
function pendLeer() { try { return JSON.parse(localStorage.getItem(PEND_KEY) || "[]"); } catch { return []; } }
function pendGuardar(lista) { try { localStorage.setItem(PEND_KEY, JSON.stringify(lista)); } catch {} }
let pendEnviando = false;
async function stockPendienteEnviar() {
  if (pendEnviando || !usaTransacciones() || !navigator.onLine) return;
  pendEnviando = true;
  try {
    for (const m of pendLeer()) {
      if (m.nid !== fb.negocioId) continue;
      try { await fbMovimiento({ deltas: new Map(m.deltas), piso0: m.piso0, soloEnLinea: true }); }
      catch (e) {
        // sin red o sin permiso: queda en la cola para el próximo intento
        if (sinRed(e) || String(e && e.code).includes("permission")) break;
        // el producto o la talla ya no existe: no hay a qué aplicarlo
      }
      pendGuardar(pendLeer().filter(x => x.id !== m.id));
    }
  } finally { pendEnviando = false; }
}
addEventListener("online", () => setTimeout(stockPendienteEnviar, 1500));

// ---------- ticket ----------
// Monto en letras como en las boletas: 120.5 → "CIENTO VEINTE CON 50/100 SOLES".
function numeroALetras(value, moneda = "S/") {
  const n = Math.round(Math.abs(n2(value)) * 100) / 100;
  const ent = Math.floor(n), cents = Math.round((n - ent) * 100);
  const u = ["", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve"];
  const d10 = ["diez", "once", "doce", "trece", "catorce", "quince", "dieciséis", "diecisiete", "dieciocho", "diecinueve"];
  const d20 = ["veinte", "veintiuno", "veintidós", "veintitrés", "veinticuatro", "veinticinco", "veintiséis", "veintisiete", "veintiocho", "veintinueve"];
  const dec = ["", "", "", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];
  const cen = ["", "ciento", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];
  const under = x => {
    if (!x) return "";
    if (x === 100) return "cien";
    if (x < 10) return u[x];
    if (x < 20) return d10[x - 10];
    if (x < 30) return d20[x - 20];
    if (x < 100) return dec[Math.floor(x / 10)] + (x % 10 ? " y " + u[x % 10] : "");
    return cen[Math.floor(x / 100)] + (x % 100 ? " " + under(x % 100) : "");
  };
  // Delante de "mil" y "millones": "veintiún mil", "ciento un mil"
  const apocope = x => under(x).replace(/veintiuno$/, "veintiún").replace(/uno$/, "un");
  const miles = x => x === 0 ? "" : x === 1 ? "mil" : apocope(x) + " mil";
  const millones = Math.floor(ent / 1000000), resto = ent % 1000000;
  const words = [
    millones === 1 ? "un millón" : millones ? apocope(millones) + " millones" : "",
    miles(Math.floor(resto / 1000)),
    under(resto % 1000)
  ].filter(Boolean).join(" ") || "cero";
  const nombreMoneda = moneda === "S/" ? "SOLES" : moneda;
  return `${words.toUpperCase()} CON ${String(cents).padStart(2, "0")}/100 ${nombreMoneda}`.trim();
}

function ticketText(n) {
  const W = 36, pad = (l, r) => { l = String(l); r = String(r); const sp = W - l.length - r.length; return sp >= 1 ? l + " ".repeat(sp) + r : l + "\n" + " ".repeat(Math.max(0, W - r.length)) + r; };
  const ctr = s => { s = String(s); const p = Math.max(0, Math.floor((W - s.length) / 2)); return " ".repeat(p) + s; };
  const hr = "-".repeat(W);
  const s = S.settings || {};
  const L = [ctr((s.negocio || "Mi negocio").toUpperCase())];
  if (s.razonSocial) L.push(ctr(s.razonSocial));
  if (s.ruc) L.push(ctr("RUC: " + s.ruc));
  if (s.direccion) L.push(ctr(s.direccion));
  if (s.ciudad) L.push(ctr(s.ciudad));
  if (s.telefono) L.push(ctr("Tel./WhatsApp: " + s.telefono));
  if (s.correo) L.push(ctr(s.correo));
  L.push(hr, ctr("NOTA DE VENTA"), ctr(folioTxt(n.folio)), hr,
    "Fecha y hora: " + fmtDate(n.fecha), "Cliente: " + (n.cliente || "Público en general"));
  if (n.doc) L.push("Doc.: " + n.doc);
  if (n.vendedorNombre) L.push("Atendió: " + n.vendedorNombre);
  L.push(hr, pad("DESCRIPCIÓN", "IMPORTE"), hr);
  (n.items || []).forEach(i => {
    L.push(i.nombre);
    L.push(pad("  " + qty(i.cant) + " x " + money(i.precio), money(n2(i.cant) * n2(i.precio))));
  });
  L.push(hr, pad("TOTAL", money(n.total)));
  if (s.montoEnLetras !== false) L.push("SON: " + numeroALetras(n.total, s.moneda || "S/"));
  if (n.pago) L.push(pad("Medio de pago", n.pago));
  if (n.obs) L.push(hr, "Obs.: " + n.obs);
  if (n.estado === "anulada") L.push(hr, ctr("*** NOTA ANULADA ***"));
  const social = [
    s.facebook && "Facebook: " + s.facebook,
    s.instagram && "Instagram: " + s.instagram,
    s.tiktok && "TikTok: " + s.tiktok,
    s.web && "Tienda virtual: " + s.web
  ].filter(Boolean);
  if (s.mostrarRedes !== false && social.length) L.push(hr, ctr("Síguenos"), ...social);
  L.push(hr, ctr(s.mensajeFinal || "Gracias por su compra"), ctr("No es comprobante de pago"));
  return L.join("\n");
}

function canPrintLocally() { return !db || fbMode; }
// Bloquea dobles clics mientras se prepara la impresión, pero nunca para siempre:
// el bloqueo se libera al volver de print() o, como respaldo, a los 15 s.
let printingFrame = null, printingSince = 0;
function printLocal(n, button) {
  printFrame(printHtml(n, false), (S.settings.papel === "58" ? 58 : 80) + "mm", button);
}
// Imprime un documento completo (ticket o A4) desde un iframe oculto del ancho del papel.
function printFrame(html, width, button) {
  if (printingFrame && Date.now() - printingSince < 15000) return;
  // Un iframe de una impresión anterior que no avisó afterprint se quita al empezar otra.
  document.querySelectorAll("iframe[data-ticket-print]").forEach(f => f.remove());
  const frame = document.createElement("iframe");
  frame.dataset.ticketPrint = "1";
  printingFrame = frame; printingSince = Date.now();
  if (button) button.disabled = true;
  frame.title = "Impresión";
  frame.style.cssText = `position:fixed;left:-10000px;top:0;width:${width};height:1000px;border:0;visibility:visible`;
  let started = false;
  const unlock = () => {
    if (printingFrame === frame) printingFrame = null;
    if (button) button.disabled = false;
  };
  const finish = () => { frame.remove(); unlock(); };
  frame.onload = () => {
    if (started || !frame.contentDocument || !frame.contentDocument.querySelector(".ticket,.a4,.hoja")) return;
    started = true;
    const win = frame.contentWindow, doc = frame.contentDocument;
    win.addEventListener("afterprint", finish, { once: true });
    Promise.resolve(doc.fonts && doc.fonts.ready).then(() => new Promise(resolve => {
      if (win.requestAnimationFrame) win.requestAnimationFrame(() => setTimeout(resolve, 50));
      else setTimeout(resolve, 100);
    })).then(() => {
      if (printingFrame !== frame) return;
      win.focus();
      win.print();
      // Chrome y Edge vuelven de print() al cerrar la vista previa; el iframe se queda hasta afterprint.
      setTimeout(unlock, 500);
    }).catch(finish);
  };
  frame.onerror = finish;
  frame.srcdoc = html;
  document.body.append(frame);
}

// ---------- notas ----------
let notesQ = "";
// Con Firebase cada equipo escucha solo las notas recientes; leer el historial completo en cada
// apertura gastaría la cuota y haría lenta la app. Las vistas piden más con notasAsegurar(desde).
const NOTAS_DIAS = 14, NOTAS_PAGINA = 100;
let notasDesde = null, notasInicio = null, notasDeCache = false, notasFolioMax = 0, notasEscuchar = null, notasLimite = NOTAS_PAGINA;
function notasAsegurar(desde) {
  if (!notasEscuchar || !notasDesde) return;
  const iso = desde ? desde.toISOString() : null;
  if (iso && iso >= notasDesde) return;
  notasEscuchar(iso);
}
// aviso para no presentar como total lo que todavía no terminó de llegar
function notasAviso() {
  if (!notasEscuchar || notasDesde === notasInicio || !notasDeCache) return "";
  return navigator.onLine === false
    ? `<p class="banner">Sin conexión: estos números pueden no incluir ventas antiguas.</p>`
    : `<p class="banner">Cargando las ventas de este período…</p>`;
}
function renderNotas() {
  if (!exigir("nota.ver", "ver notas")) return;
  const el = $("#v-notas");
  const focusId = document.activeElement && document.activeElement.id;
  const notes = [...S.notes].sort((a, b) => n2(b.folio) - n2(a.folio));
  const q = norm(notesQ);
  const list = notes.filter(n => !q || norm(folioTxt(n.folio) + " " + (n.cliente || "") + " " + (n.doc || "") + " " + (n.pago || "") + " " + n.items.map(i => i.nombre).join(" ")).includes(q));
  if (!S.selNote || !S.notes.some(n => n.id === S.selNote)) S.selNote = list[0] && list[0].id;
  const sel = S.notes.find(n => n.id === S.selNote);
  const today = new Date().toDateString();
  const todays = notes.filter(n => n.estado !== "anulada" && new Date(n.fecha).toDateString() === today);
  const valid = notes.filter(n => n.estado !== "anulada");
  el.innerHTML = `
    <div class="toolbar"><h1 style="margin-right:auto">Notas de venta</h1><button class="btn primary" data-view="venta">+ Nueva venta</button></div>
    <div class="stats">
      <div class="stat"><b>${todays.length}</b><span>Notas de hoy</span></div>
      ${puede("estadisticas.ver") ? `<div class="stat"><b>${money(todays.reduce((a, n) => a + n2(n.total), 0))}</b><span>Vendido hoy</span></div>` : ""}
      <div class="stat"><b>${valid.length}</b><span>Notas emitidas${notasDesde ? ` (${NOTAS_DIAS} días)` : ""}</span></div>
      ${puede("estadisticas.ver") ? `<div class="stat"><b>${money(valid.reduce((a, n) => a + n2(n.total), 0))}</b><span>Total vendido${notasDesde ? ` (${NOTAS_DIAS} días)` : ""}</span></div>` : ""}
    </div>
    ${notasAviso()}
    <div class="notes">
      <div>
        <div class="toolbar"><input class="grow" type="search" id="notesSearch" placeholder="Buscar por folio, cliente o producto" value="${esc(notesQ)}"></div>
        ${!S.loaded ? `<div class="empty">Cargando notas…</div>` : !notes.length ? `<div class="empty"><h2>Aún no hay notas</h2><p>Crea una en <b>Nueva venta</b>. Cada nota emitida descuenta los productos del inventario.</p></div>` :
          `<div class="list">${list.slice(0, notasLimite).map(n => `<button class="nrow ${n.estado === "anulada" ? "voided" : ""}" data-note="${esc(n.id)}" aria-current="${n.id === S.selNote}">
            <span class="fol">${folioTxt(n.folio)}</span>
            <span class="who">${esc(n.cliente || "Público en general")}<small>${fmtDate(n.fecha)} · ${n.items.length} ${n.items.length === 1 ? "ítem" : "ítems"}${n.pago ? " · " + esc(n.pago) : ""}${n.estado === "anulada" ? " · anulada" : ""}</small></span>
            <span class="amt num">${money(n.total)}</span></button>`).join("") || `<div class="empty">Ninguna nota coincide.</div>`}</div>`}
        ${list.length > notasLimite ? `<div class="inv-mas" style="margin:10px 0 0"><span class="muted">Se muestran ${notasLimite} de ${list.length} notas.</span><button class="btn" id="n-mas">Ver más</button></div>` : ""}
        ${notasDesde ? `<div class="inv-mas" style="margin:10px 0 0"><span class="muted">Se ven las notas de los últimos ${NOTAS_DIAS} días.</span><button class="btn" id="n-todas">Ver todas las notas</button></div>` : ""}
      </div>
      <div style="display:flex;flex-direction:column">
        ${sel ? ticketHtml(sel) + `<div class="ticket-actions">
            <button class="btn primary" id="n-print" ${puede("nota.imprimir") ? "" : "hidden"}>Imprimir ticket</button>
            <button class="btn" id="n-copy" ${puede("nota.imprimir") ? "" : "hidden"}>Copiar texto</button>
            <button class="btn" id="n-dl" ${puede("nota.imprimir") ? "" : "hidden"}>Descargar .txt</button>
            ${sel.estado !== "anulada" && puede("nota.anular") ? `<button class="btn danger" id="n-void">Anular y devolver stock</button>` : ""}
          </div>` : ""}
      </div>
    </div>`;
  if (focusId === "notesSearch") { const i = $("#notesSearch"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
$("#v-notas").addEventListener("input", e => { if (e.target.id === "notesSearch") { notesQ = e.target.value; notasLimite = NOTAS_PAGINA; renderNotas(); } });
$("#v-notas").addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  const sel = S.notes.find(n => n.id === S.selNote);
  if (t.id === "n-mas") { notasLimite += NOTAS_PAGINA; return renderNotas(); }
  if (t.id === "n-todas") return notasAsegurar(null);
  if (t.dataset.note) { S.selNote = t.dataset.note; return renderNotas(); }
  if ((t.id === "n-copy" || t.id === "n-print" || t.id === "n-dl") && !exigir("nota.imprimir", "imprimir notas")) return;
  if (t.id === "n-copy" && sel) {
    const txt = ticketText(sel);
    try { await navigator.clipboard.writeText(txt); toast("Nota copiada"); }
    catch { const ta = document.createElement("textarea"); ta.value = txt; document.body.append(ta); ta.select(); try { document.execCommand("copy"); toast("Nota copiada"); } catch { toast("Selecciona y copia el texto manualmente"); } ta.remove(); }
    return;
  }
  if (t.id === "n-print" && sel) {
    if (canPrintLocally()) printLocal(sel, t);
    else await saveFile(folioTxt(sel.folio) + "-ticket.html", printHtml(sel));
    return;
  }
  if (t.id === "n-dl" && sel) return saveFile(folioTxt(sel.folio) + ".txt", ticketText(sel));
  if (t.id === "n-void" && sel) {
    if (!exigir("nota.anular", "anular notas")) return;
    if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Confirmar anulación"; return; }
    t.disabled = true;
    try {
      await flushPendingStock();
      if (usaTransacciones()) await fbMovimiento({ deltas: deltasDe(sel.items, +1), anular: sel });
      else {
        const changed = await adjustStock(sel.items, +1);
        try { await putNote({ ...sel, items: sel.items.map(i => ({ ...i })), estado: "anulada", anulada: new Date().toISOString() }); }
        catch (err) {
          await restoreProducts(changed);
          try { await putNote(sel); } catch {}
          throw err;
        }
      }
      toast("Nota anulada; el stock se devolvió al inventario");
    } catch (err) { toast(err.aviso || "No se pudo anular; no se cambió nada. " + failMsg(err)); t.disabled = false; }
  }
});

// html2pdf se carga solo la primera vez que se envía una cotización.
let html2pdfLoad = null;
function loadHtml2pdf() {
  if (window.html2pdf) return Promise.resolve(window.html2pdf);
  html2pdfLoad = html2pdfLoad || new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
    s.onload = () => ok(window.html2pdf);
    s.onerror = () => { html2pdfLoad = null; s.remove(); fail(new Error("pdf")); };
    document.head.append(s);
  });
  return html2pdfLoad;
}
async function quotePdfBlob(q) {
  const html2pdf = await loadHtml2pdf();
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:-10000px;top:0;width:186mm;background:#fff";
  box.innerHTML = quoteDocHtml(q);
  const page = box.firstElementChild;
  page.style.cssText = "padding:0;max-width:none;box-shadow:none;border-radius:0";
  document.body.append(box);
  try {
    return await html2pdf().set({
      margin: 12,
      image: { type: "jpeg", quality: 0.95 },
      html2canvas: { scale: 2, backgroundColor: "#fff", scrollX: 0, scrollY: 0 }, // sin esto, con la página desplazada sale en blanco
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
      pagebreak: { mode: ["css", "legacy"], avoid: "tr" },
    }).from(page).outputPdf("blob");
  } finally { box.remove(); }
}
// WhatsApp no deja adjuntar archivos con un enlace: en el celular se comparte el PDF
// (eliges WhatsApp y el contacto); en la computadora se abre el chat del número y se descarga el PDF.
let quotePdfCache = null; // { key, blob }: el PDF ya hecho, para compartirlo al tocar de nuevo
async function sendQuotePdf(q, btn) {
  const phone = String(q.telefono || "").replace(/\D/g, "");
  const to = phone.length === 9 ? "51" + phone : phone; // celular peruano sin código de país
  const name = quoteNum(q.numero) + (q.cliente ? " " + q.cliente.replace(/[\\/:*?"<>|]/g, "") : "") + ".pdf";
  const text = `Hola${q.cliente ? " " + q.cliente : ""}, te envío la cotización ${quoteNum(q.numero)} de ${S.settings.negocio}. Total: ${money(q.total)}.`;
  const phoneShare = !!navigator.canShare && matchMedia("(pointer:coarse)").matches;
  // la ventana se abre en el mismo toque; si se abre después de crear el PDF, el navegador la bloquea
  if (!phoneShare) window.open("https://wa.me/" + to + "?text=" + encodeURIComponent(text), "_blank", "noopener");
  const key = JSON.stringify([q, S.settings]);
  let blob = quotePdfCache && quotePdfCache.key === key ? quotePdfCache.blob : null;
  if (!blob) {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Preparando PDF…";
    try { blob = await quotePdfBlob(q); quotePdfCache = { key, blob }; }
    catch { toast("No se pudo crear el PDF. Revisa tu internet."); return; }
    finally { btn.disabled = false; btn.textContent = label; }
  }
  if (phoneShare) {
    const file = new File([blob], name, { type: "application/pdf" });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], text }); return; }
      catch (e) {
        if (e.name === "AbortError") return;
        // crear el PDF tardó y el celular ya no permite compartir: el siguiente toque comparte al instante
        if (e.name === "NotAllowedError") { toast("PDF listo. Toca otra vez «Enviar por WhatsApp»."); return; }
      }
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(phoneShare ? "PDF descargado. Adjúntalo en el chat de WhatsApp." : "PDF descargado. Arrástralo al chat de WhatsApp que se abrió.");
}
async function saveQuote(btn) {
  const qd = quoteEdit;
  const prev = qd.id ? S.quotes.find(x => x.id === qd.id) : null;
  if (!exigir(prev ? "cotizacion.editar" : "cotizacion.crear", "guardar cotizaciones")) return;
  const items = qd.items.filter(i => n2(i.cant) > 0).map(i => ({ ...i, cant: n2(i.cant), precio: n2(i.precio) }));
  if (!items.length) return;
  const subtotal = round2(quoteSubtotal({ items }));
  const descuento = Math.min(round2(qd.descuento), subtotal);
  const user = usuarioActual();
  const quote = {
    ...(prev || {}),
    id: prev ? prev.id : uid(),
    numero: prev ? prev.numero : nextQuoteNum(),
    fecha: prev ? prev.fecha : new Date().toISOString(),
    cliente: qd.cliente.trim(), doc: qd.doc.trim(), telefono: qd.telefono.trim(), direccion: qd.direccion.trim(),
    validez: n2(qd.validez) || 15, obs: qd.obs.trim(), items, subtotal, descuento, total: round2(subtotal - descuento),
    estado: prev ? prev.estado || "pendiente" : "pendiente",
    vendedorId: prev ? prev.vendedorId : user?.id, vendedorNombre: prev ? prev.vendedorNombre : user?.nombre,
  };
  btn.disabled = true;
  try {
    await putQuote(quote);
    store.set("mostrador.quoteObs", quote.obs);
    quoteEdit = null; quotePickQ = ""; saveQuoteDraft();
    selQuote = quote.id;
    toast("Cotización " + quoteNum(quote.numero) + " guardada");
    renderCotizaciones();
  } catch (err) { toast(failMsg(err)); btn.disabled = false; }
}

        cell.font = xlFont({ color: { argb: muted ? XL.muted : XL.fg } });
        cell.border = xlBox;
        if (c.h === "Estado" && XL_ESTADO[v]) cell.font = xlFont({ bold: true, color: { argb: XL_ESTADO[v] } });

    });
    if (!sheet.rows.length) {
      ws.mergeCells(first, 1, first, n);
      const cell = ws.getCell(first, 1);
      cell.value = "Sin datos para este período.";
      cell.font = xlFont({ italic: true, color: { argb: XL.muted } });
      cell.alignment = { horizontal: "center" };
    } else ws.autoFilter = { from: { row: hr, column: 1 }, to: { row: last, column: n } };

}

function bookCsv(book) {
  const rows = [[book.title + (book.period ? " · " + book.period : "")], []];
  const plain = (v, t) => { const x = v && v.v !== undefined ? v.v : v; return t === "d" ? fmtDay(x) : t === "dt" ? fmtDate(x) : typeof x === "number" ? round2(x) : x == null ? "" : x; };
  book.sheets.forEach(sh => {
    const cols = sh.cols.map((c, k) => [c, k]);
    rows.push([sh.name], cols.map(([c]) => c.h));
    sh.rows.forEach(r => rows.push(cols.map(([c, k]) => plain(r[k], c.t))));
    if (sh.foot) rows.push(cols.map(([c, k]) => sh.foot[k] === "sum" ? round2(xlSum(sh.rows, k)) : plain(sh.foot[k], c.t)));
    rows.push([]);
  });

  }
  const label = btn && btn.textContent;
  if (btn) { btn.disabled = true; btn.textContent = "Preparando Excel…"; }
  try {
    const ExcelJS = await loadExcel();
    const buffer = await xlWorkbook(ExcelJS, book).xlsx.writeBuffer();

    await saveFile(name + ".csv", bookCsv(book));
  } finally {
    if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; }
  }
}

// imita la base db de claude.ai para que el resto de la app funcione igual
function fbDb(nid) {
  const { F, fs } = fb;
  const base = "negocios/" + nid + "/";
  const wrap = s => ({ id: s.id, exists: s.exists(), data: () => s.data() });
  const docApi = path => {
    const ref = F.doc(fs, base + path);
    return {
      get: async () => wrap(await F.getDoc(ref)),
      set: body => fbWrite(F.setDoc(ref, body)),
      update: patch => fbWrite(F.updateDoc(ref, patch)),
      delete: () => fbWrite(F.deleteDoc(ref)),
      onSnapshot: (cb, err) => fbTrack(F.onSnapshot(ref, s => cb(wrap(s)), err)),
    };
  };
  return {
    doc: docApi,
    collection: name => ({
      doc: id => docApi(name + "/" + id),
      get: async () => ({ docs: (await F.getDocs(F.collection(fs, base + name))).docs.map(wrap) }),
      onSnapshot: (cb, err) => fbTrack(F.onSnapshot(F.collection(fs, base + name), s => cb({ docs: s.docs.map(wrap) }), err)),
    }),
    // para el folio basta la nota más alta; leer todas en cada venta gastaría la cuota gratis
    // notas desde una fecha (null = todas); avisa si lo que llega aún viene de la copia del equipo
    notesDesde: (desde, cb, err) => {
      const col = F.collection(fs, base + "notes");
      const q = desde ? F.query(col, F.where("fecha", ">=", desde)) : col;
      return fbTrack(F.onSnapshot(q, { includeMetadataChanges: true }, s => cb({
        docs: s.docs.map(wrap), fromCache: s.metadata.fromCache, cambios: s.docChanges().length,
      }), err));
    },
    notesRango: async (desde, hasta) => (await F.getDocs(F.query(F.collection(fs, base + "notes"), F.where("fecha", ">=", desde), F.where("fecha", "<", hasta)))).docs.map(d => ({ id: d.id, ...d.data() })),
    notesServidor: async () => ({ docs: (await F.getDocsFromServer(F.collection(fs, base + "notes"))).docs.map(wrap) }),
    // cada cierre es un documento: se escuchan solo los últimos para que el historial no encarezca cada apertura
    cajasRecientes: (cb, err) => fbTrack(F.onSnapshot(F.query(F.collection(fs, base + "cajas"), F.orderBy("abiertaEn", "desc"), F.limit(60)), s => cb({ docs: s.docs.map(wrap) }), err)),
    cajasServidor: async () => ({ docs: (await F.getDocsFromServer(F.collection(fs, base + "cajas"))).docs.map(wrap) }),
    lastNotes: async () => {
      const q = F.query(F.collection(fs, base + "notes"), F.orderBy("folio", "desc"), F.limit(1));
      return (await F.getDocs(q)).docs.map(d => ({ id: d.id, ...d.data() }));
    },
  };
}

// arranca o detiene la escucha de la vitrina y programa la copia de cambios
function webSync() {
  if (!webVinculada()) { webCat = null; return; }
  const nid = fb.negocioId;
  if (!webCat || webCat.nid !== nid) {
    webCat = { nid, actual: new Map(), listo: false };
    const cat = webCat;
    fbTrack(fb.F.onSnapshot(fb.F.collection(fb.fs, "catalogo/" + nid + "/productos"), snap => {
      cat.actual = new Map(snap.docs.map(d => { const x = { ...d.data() }; delete x.actualizado; return [d.id, JSON.stringify(x)]; }));
      cat.listo = true;
      webProgramar();
    }, () => {}));
    return;
  }
  webProgramar();
}
function webProgramar() { clearTimeout(webTimer); webTimer = setTimeout(webPublicar, 1500); }
// escribe solo lo que cambió; el vendedor solo puede actualizar stock (lo demás lo completa el administrador)
async function webPublicar() {
  const cat = webCat;
  if (!cat || !cat.listo || !webVinculada()) return;
  const { F, fs } = fb, base = "catalogo/" + cat.nid + "/productos/", admin = puede("producto.editar");
  const ahora = new Date().toISOString();
  const quiere = new Map(S.products.filter(p => p.web).map(p => [p.id, webPublico(p)]));
  for (const [id, body] of quiere) {
    if (cat.actual.get(id) === JSON.stringify(body)) continue;
    const ref = F.doc(fs, base + id);
    const w = admin || !cat.actual.has(id) ? F.setDoc(ref, { ...body, actualizado: ahora })
      : F.updateDoc(ref, { stock: body.stock, variantes: body.variantes, actualizado: ahora });
    fbWrite(w).catch(() => {});
  }
  if (admin) for (const id of cat.actual.keys()) if (!quiere.has(id)) fbWrite(F.deleteDoc(F.doc(fs, base + id))).catch(() => {});
}

function fbError(e) {
  const c = String(e && e.code || "");
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return "Correo o contraseña incorrectos.";
  if (c.includes("email-already-in-use")) return "Ese correo ya tiene cuenta. Usa Entrar.";
  if (c.includes("weak-password")) return "La contraseña debe tener al menos 6 caracteres.";
  if (c.includes("invalid-email")) return "Ese correo no es válido.";
  if (c.includes("too-many-requests")) return "Demasiados intentos. Espera unos minutos.";
  if (c.includes("network") || c.includes("unavailable")) return "Sin conexión. Revisa tu internet.";
  if (c.includes("permission-denied")) return "No tienes permiso para esto.";
  return "Algo falló. Inténtalo otra vez.";
}

async function crearNegocio(nombre, local) {
  const { F, fs } = fb, user = fb.auth.currentUser;
  const nid = F.doc(F.collection(fs, "negocios")).id;
  const batch = F.writeBatch(fs);
  batch.set(F.doc(fs, "negocios/" + nid), { nombre, dueno: user.uid, creado: F.serverTimestamp() });
  batch.set(F.doc(fs, "negocios/" + nid + "/miembros/" + user.uid), {
    nombre: fbNombreUsuario(user), email: user.email, rol: "admin", activo: true, unido: F.serverTimestamp(),
  });
  batch.set(F.doc(fs, "usuarios/" + user.uid), { negocioId: nid, email: user.email });
  await batch.commit();
  // va aparte: las reglas exigen que ya exista el administrador
  const ajustes = { moneda: "S/", papel: "80", ...(local?.settings || {}), negocio: nombre };
  await F.setDoc(F.doc(fs, "negocios/" + nid + "/settings/app"), ajustes);
  if (local) await copiarDatosLocales(nid, local);
  await abrirNegocio(nid);
}
async function copiarDatosLocales(nid, local) {
  const { F, fs } = fb;
  const docs = [
    ...(local.products || []).filter(p => p && p.id).map(p => ["products", p]),
    ...(local.notes || []).filter(n => n && n.id).map(n => ["notes", n]),
    ...(local.quotes || []).filter(q => q && q.id).map(q => ["quotes", q]),
    ...(local.cajas || []).filter(x => x && x.id).map(x => ["cajas", x]),
  ];
  // un lote de Firestore admite hasta 500 escrituras
  for (let i = 0; i < docs.length; i += 400) {
    fbCargando("Copiando tus datos… " + Math.min(i + 400, docs.length) + " de " + docs.length);
    const batch = F.writeBatch(fs);
    docs.slice(i, i + 400).forEach(([col, item]) => {
      const body = { ...item }; delete body.id;
      batch.set(F.doc(fs, "negocios/" + nid + "/" + col + "/" + item.id), body);
    });
    await batch.commit();
  }
}
async function unirmeConCodigo(codigo) {
  const { F, fs } = fb, user = fb.auth.currentUser;
  if (codigo.length !== 8) throw new Error("El código tiene 8 letras y números, por ejemplo ABCD-2345.");
  const invRef = F.doc(fs, "invitaciones/" + codigo);
  const inv = await F.getDoc(invRef);
  if (!inv.exists()) throw new Error("Ese código no existe. Revisa que esté bien escrito.");
  const d = inv.data();
  if (d.usadoPor && d.usadoPor !== user.uid) throw new Error("Ese código ya se usó. Pide uno nuevo.");
  if (d.expira.toMillis() < Date.now()) throw new Error("Ese código venció. Pide uno nuevo.");
  const batch = F.writeBatch(fs);
  if (!d.usadoPor) batch.update(invRef, { usadoPor: user.uid });
  batch.set(F.doc(fs, "negocios/" + d.negocioId + "/miembros/" + user.uid), {
    nombre: fbNombreUsuario(user), email: user.email, rol: d.rol, activo: true, codigo, unido: F.serverTimestamp(),
  });
  batch.set(F.doc(fs, "usuarios/" + user.uid), { negocioId: d.negocioId, email: user.email });
  await batch.commit();
  await abrirNegocio(d.negocioId);
}
async function fbEntrar(user) {
  fbCargando("Cargando tu negocio…");

    const miembro = await F.getDoc(F.doc(fs, "negocios/" + nid + "/miembros/" + user.uid));

    await abrirNegocio(nid);

}

// escucha productos, notas, ajustes y usuarios del almacén (db de claude.ai o negocio de Firebase)
function escucharDatos() {
  let gotP = false, gotN = false, gotU = false;
  const ready = () => {
    if (!(gotP && gotN && gotU)) return;
    const first = !S.loaded;
    S.loaded = true;
    if (!fbMode) { try { sessionId = sessionStorage.getItem("mostrador.session"); } catch {} }
    if (usuarioActual()) { if (first || $("#authScreen")) renderApp(); else { aplicarPermisosUI(); renderAll(); } }
    else if (fbMode) fbSinAcceso();
    else renderLogin();
    if (first && fbMode) setTimeout(nombresReservarExistentes, 4000);
  };
  const sinPermiso = e => fbMode && e && e.code === "permission-denied" && fbSinAcceso();
  db.collection("products").onSnapshot(snap => {
    S.products = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .map(p => {
        // conserva el conteo local mientras haya un guardado pendiente del producto o de una de sus variantes
        const pending = pendingStock.has(p.id) || [...pendingStock.keys()].some(k => k.startsWith(p.id + ":"));
        const local = pending && S.products.find(x => x.id === p.id);
        return local ? { ...p, stock: local.stock, ...(local.variantes ? { variantes: local.variantes } : {}) } : p;
      });
    simCache.clear(); gotP = true; ready();
    if (fbMode) webSync();
    // no redibujar mientras se escribe en el stock de una fila
    const a = document.activeElement;
    if (S.view === "inventario" && a && a.dataset && a.dataset.stk) return;
    if (dlg.open && S.view === "inventario") return;
    renderAll();
  }, e => { if (sinPermiso(e)) return; $("#banner").textContent = "Se perdió la conexión con el almacén. Recarga la página."; $("#banner").hidden = false; });
  if (db.notesDesde) {
    const notasDb = db;
    let notasCortar = null;
    notasEscuchar = desde => {
      if (db !== notasDb) return;
      if (notasCortar) notasCortar();
      notasDesde = desde;
      notasDeCache = true;
      const primera = !gotN;
      notasCortar = db.notesDesde(desde, snap => {
        const cambio = notasDeCache !== snap.fromCache;
        notasDeCache = snap.fromCache;
        S.notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const antes = gotN;
        gotN = true; ready();
        if (snap.cambios || cambio || !antes) renderAll();
      }, sinPermiso);
      if (!primera) renderAll();
    };
    const corte = new Date();
    corte.setDate(corte.getDate() - NOTAS_DIAS);
    notasInicio = corte.toISOString();
    notasEscuchar(notasInicio);
    // el número de la próxima nota no depende de cuántas se hayan descargado
    db.lastNotes().then(r => { notasFolioMax = r[0] ? n2(r[0].folio) : 0; if (S.view === "venta") renderAll(); }).catch(() => {});
    // cambios de stock por talla que quedaron pendientes de una venta o conteo sin internet
    setTimeout(stockPendienteEnviar, 3000);
  } else db.collection("notes").onSnapshot(snap => {
    S.notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    gotN = true; ready(); renderAll();
  }, sinPermiso);
  // las cotizaciones no detienen la app: si las reglas de Firebase aún no las permiten, solo se avisa
  const quotesDb = db;
  const escucharCotizaciones = () => db.collection("quotes").onSnapshot(snap => {
    S.quotes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    quotesBlocked = false;
    if (S.view === "cotizaciones" || S.view === "reportes") renderAll();
  }, e => {
    quotesBlocked = !!(e && e.code === "permission-denied");
    if (S.view === "cotizaciones") renderAll();
    // tras un error Firebase deja de avisar cambios: se vuelve a escuchar (por ejemplo, después de publicar las reglas)
    setTimeout(() => { if (db === quotesDb) escucharCotizaciones(); }, 10000);
  });
  escucharCotizaciones();
  // la caja tampoco detiene la app: sin las reglas nuevas se sigue vendiendo y solo se avisa en la vista Caja
  const cajasDb = db;
  const cajasLlegan = snap => {
    S.cajas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    cajasBlocked = false;
    if (S.view === "caja" || S.view === "venta") renderAll();
  };
  const cajasFallan = e => {
    cajasBlocked = !!(e && e.code === "permission-denied");
    if (S.view === "caja") renderAll();
    setTimeout(() => { if (db === cajasDb) escucharCajas(); }, 10000);
  };
  const escucharCajas = () => db.cajasRecientes ? db.cajasRecientes(cajasLlegan, cajasFallan) : db.collection("cajas").onSnapshot(cajasLlegan, cajasFallan);
  escucharCajas();
  db.doc("settings/app").onSnapshot(s => { if (s.exists) { S.settings = { negocio: "Mi negocio", moneda: "S/", ...s.data() }; if (fbMode) webSync(); renderAll(); } }, () => {});
  if (fbMode) {
    db.collection("miembros").onSnapshot(snap => {
      S.users = snap.docs.map(d => ({ id: d.id, usuario: d.data().email, ...d.data() }));
      gotU = true; ready();
    }, sinPermiso);
  } else {
    db.doc("settings/users").onSnapshot(s => { S.users = s.exists ? (s.data().list || []) : []; gotU = true; ready(); }, () => { gotU = true; ready(); });
  }
}
// ---------- instalación PWA ----------
let installPrompt = null;
const installButton = $("#installApp");
const isInstalled = () => window.matchMedia?.("(display-mode: standalone)").matches || navigator.standalone === true;
if (installButton) {
  const updateInstallButton = () => { installButton.hidden = isInstalled() || !installPrompt; };
  updateInstallButton();
  window.addEventListener("beforeinstallprompt", event => {
    if (isInstalled()) return;
    event.preventDefault();
    installPrompt = event;
    updateInstallButton();
  });
  window.addEventListener("appinstalled", () => { installPrompt = null; updateInstallButton(); });
  installButton.addEventListener("click", async () => {
    if (!installPrompt) return;
    const prompt = installPrompt;
    installPrompt = null;
    updateInstallButton();
    try { await prompt.prompt(); } catch {}
  });
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isSafari = /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent);
// en iPhone no hay botón de instalar: se indica una sola vez cómo hacerlo
if (isIOS && isSafari && !isInstalled() && /^https?:$/.test(location.protocol) && !window.claude && !store.get("mostrador.iosHint")) {
  store.set("mostrador.iosHint", true);
  setTimeout(() => toast("Para instalar: Compartir → Agregar a pantalla de inicio"), 1200);
}
try {
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.claude) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
} catch {}
})();
</script>
