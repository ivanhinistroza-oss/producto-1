<title>Mostrador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra superior con pestañas; cada vista es una columna de trabajo, la nota de venta se ve como ticket de papel */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#e3e9e5; --line:#cdd7d1;
  --fg:#17231f; --muted:#5a6b64; --accent:#0d6e5f; --accent-fg:#ffffff; --accent-soft:#d3ebe5;
  --warn:#a35c00; --warn-soft:#fbe9cf; --bad:#b3261e; --bad-soft:#f9dedc; --paper:#fffef9; --paper-ink:#232220;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18221f; --surface-2:#22302b; --line:#2f3f39;
  --fg:#e3ece8; --muted:#97aaa2; --accent:#4cc3ad; --accent-fg:#06221c; --accent-soft:#183d36;
  --warn:#f0b462; --warn-soft:#3a2a12; --bad:#f2958e; --bad-soft:#3d1a18; --paper:#1f2624; --paper-ink:#e8e6df; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18221f; --surface-2:#22302b; --line:#2f3f39;
  --fg:#e3ece8; --muted:#97aaa2; --accent:#4cc3ad; --accent-fg:#06221c; --accent-soft:#183d36;
  --warn:#f0b462; --warn-soft:#3a2a12; --bad:#f2958e; --bad-soft:#3d1a18; --paper:#1f2624; --paper-ink:#e8e6df; color-scheme:dark}

*{box-sizing:border-box}
/* fuera de claude.ai no hay reset: sin esto, .btn{display:inline-flex} mostraría botones ocultos por permisos */
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:fixed;inset:0 auto 0 0;width:220px;z-index:15;background:var(--surface);border-right:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;align-items:stretch;gap:22px;padding:20px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;flex-direction:column;gap:4px;width:100%}
nav.tabs button{font:600 14px var(--f-body);text-align:left;background:transparent;color:var(--muted);border:0;border-left:3px solid transparent;padding:10px 12px;min-height:40px;border-radius:6px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-left-color:var(--accent)}
nav.tabs button:hover{background:var(--surface-2);color:var(--fg)}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}
.dash-card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.dash-card h2{font-size:16px;margin:0;display:inline}
.dash-subtitle{font-size:12.5px;color:var(--muted);margin-left:7px}
.dash-heading{margin-bottom:12px}
.dash-wide{grid-column:1/-1}
.summary-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:14px 0}
.summary-stat{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.summary-stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.summary-stat-value{font:600 clamp(18px,5vw,24px) var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.summary-stat-context{font-size:13px;color:var(--muted)}
.summary-stat.warn .summary-stat-value{color:var(--warn)}
.summary-alerts{display:grid;gap:8px}
.alert-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.alert-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-stock{white-space:nowrap;font-size:12.5px}
.alert-more{margin-top:10px}
.bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.bar-label{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{display:flex;align-items:center;gap:7px;min-width:0}
.bar{height:14px;border-radius:0 4px 4px 0;background:var(--accent);flex:none;max-width:100%}
.bar-val{white-space:nowrap;font-size:12.5px;color:var(--muted)}
.rank{color:var(--muted);margin-right:5px}
.summary-table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.summary-table{border-collapse:collapse;width:100%;min-width:760px;text-align:left}
.summary-table th,.summary-table td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
.summary-table th{font-size:12px;color:var(--muted);white-space:nowrap}
.summary-table th button{all:unset;cursor:pointer;font:inherit;color:inherit}
.summary-table th button:hover{color:var(--fg)}
.summary-table td.num{text-align:right;white-space:nowrap}
.summary-table tbody tr:last-child td{border-bottom:0}
.sales-chart-wrap{overflow-x:auto;max-width:100%}
.sales-chart{position:relative;display:grid;grid-template-columns:64px minmax(600px,1fr);min-height:230px}
.sales-axis{display:flex;flex-direction:column;justify-content:space-between;padding:0 6px 24px 0;color:var(--muted);font:11px var(--f-mono);text-align:right;white-space:nowrap}
.sales-plot{position:relative;display:flex;align-items:stretch;gap:3px;height:206px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent calc(50% - .5px),var(--line) calc(50% - .5px),var(--line) 50%,transparent 50%,transparent calc(100% - 1px),var(--line) calc(100% - 1px),var(--line) 100%)}
.sales-bar-col{position:relative;flex:1;min-width:8px;display:flex;align-items:flex-end;justify-content:center}
.sales-bar{width:min(72%,24px);min-height:2px;background:var(--accent);border-radius:4px 4px 0 0}
.sales-xlabels{display:flex;gap:3px;padding-left:64px;min-width:664px}
.sales-xlabels span{flex:1;min-width:8px;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap}
.sales-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sales-controls .seg button{padding:7px 9px}
.sales-table tbody tr{cursor:pointer}
.sales-table tbody tr:hover{background:var(--surface-2)}
.sales-summary{display:block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sales-table .voided{text-decoration:line-through;color:var(--muted)}
.sales-table tfoot td{font-weight:700;border-top:2px solid var(--fg)}
.sales-empty{padding:16px;color:var(--muted);text-align:center}
.sales-top-toggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:8px;vertical-align:middle}
.sales-top-toggle button{border:0;background:transparent;padding:4px 7px;color:var(--muted);font-size:11px;cursor:pointer}
.sales-top-toggle button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.table-stock{display:inline-flex;align-items:center;justify-content:flex-end;gap:8px}
.table-stock-bar{width:60px;height:6px;border-radius:4px;background:var(--accent);opacity:.35;flex:none}
.variant-detail{padding:5px 10px 9px 28px!important;color:var(--muted);font-size:13px}
.heat-wrap{overflow-x:auto;max-width:100%}
.heat-table{border-collapse:separate;border-spacing:2px;min-width:max-content;text-align:center}
.heat-table th,.heat-table td{padding:7px 9px;border-radius:4px;white-space:nowrap}
.heat-table th{font-size:12px;color:var(--muted);font-weight:600}
.heat-cell{font:12.5px var(--f-mono);font-variant-numeric:tabular-nums}
.heat-zero{background:var(--surface)!important;color:var(--bad);outline:1px dotted var(--bad)}
.heat-missing{color:var(--muted)}
.heat-total{font-weight:700}
.heat-legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--muted)}
.heat-swatch{width:18px;height:12px;border-radius:2px;border:1px solid var(--line)}
@media(max-width:899px){
  header.top{position:relative;inset:auto;width:100%;border-right:0;border-bottom:1px solid var(--line)}
  header.top .wrap{max-width:1100px;flex-direction:row;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px))}
  .brand{font-size:20px}
  nav.tabs{position:fixed;inset:auto 0 0;z-index:15;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px))}
  nav.tabs button{text-align:center;border:0;border-top:3px solid transparent;border-radius:6px;padding:5px 1px;font-size:11px;min-height:42px;white-space:nowrap}
  nav.tabs button[aria-selected="true"]{border-top-color:var(--accent)}
  main.wrap{width:100%;height:auto;min-height:calc(100dvh - 120px);margin:0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:visible}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:700px){.dash-grid{grid-template-columns:minmax(0,1fr)}.dash-wide{grid-column:auto}.summary-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.bar-row{grid-template-columns:minmax(0,1fr);gap:2px}.bar-label{text-align:left}}
@media(max-width:700px){.sales-chart{grid-template-columns:64px minmax(600px,1fr)}.sales-axis{font-size:10px}.sales-top-toggle{margin-left:2px}}
main.wrap{max-width:1100px;width:calc(100% - 220px);height:100dvh;margin:0 0 0 220px;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.banner{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=search],input[type=datetime-local],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f > span{letter-spacing:.02em}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1 1 220px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}

.stats{display:flex;flex-wrap:wrap;gap:8px 28px;padding:12px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.warn b{color:var(--warn)}

.group{margin-bottom:22px}
.group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.group-head .count{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.low{background:var(--warn-soft);color:var(--warn)}
.chip.out{background:var(--bad-soft);color:var(--bad)}
.chip.ex{background:var(--accent-soft);color:var(--fg)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{min-width:0}
.row .name button{all:unset;cursor:pointer;font-weight:600;overflow-wrap:anywhere}
.row .name button:hover{text-decoration:underline}
.row .meta{font-size:12.5px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row .price{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.counter{display:flex;align-items:center;gap:2px}
.counter button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font:600 18px var(--f-mono);line-height:1}
.counter button:hover{border-color:var(--muted)}
.counter input{width:64px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;padding:6px 4px}
.counter .u{font-size:12px;color:var(--muted);margin-left:4px;min-width:24px}
@media (max-width:620px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .price{grid-column:2;grid-row:1}
  .row .counter{grid-column:1 / -1;justify-self:start}
}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);margin-bottom:6px}

/* Diálogo de producto */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--fg);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:480px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.similar{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.similar ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.similar li{display:flex;justify-content:space-between;gap:10px}
.similar .pct{font-family:var(--f-mono);color:var(--muted)}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions .r{display:flex;gap:8px;margin-left:auto}

/* Venta */
.sale{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.sale{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.picker{position:relative}
.results{border:1px solid var(--line);border-radius:8px;margin-top:6px;max-height:280px;overflow:auto;background:var(--surface)}
.results button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer}
.results button:first-child{border-top:0}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.results small{color:var(--muted);font-size:12px}
.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:minmax(0,1fr) 76px 96px 90px 30px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .nm{font-weight:600;overflow-wrap:anywhere;min-width:0}
.line .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.line input{text-align:right;font-family:var(--f-mono);padding:6px 8px}
.line .sub{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.line .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;border-radius:6px;height:30px}
.line .x:hover{color:var(--bad);background:var(--bad-soft)}
.line-head{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0;padding-bottom:2px}
@media (max-width:520px){
  .line{grid-template-columns:minmax(0,1fr) 70px 86px 26px}
  .line .sub{grid-column:1 / 4;text-align:left;font-size:13px;color:var(--muted)}
  .line .sub::before{content:"Importe: "}
  .line-head .sub{display:none}
}
.warnline{color:var(--warn);font-size:12px}
.total-row{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--fg);padding-top:10px}
.total-row b{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}

/* Ticket */
.ticket{background:var(--paper);color:var(--paper-ink);font-family:var(--f-mono);font-size:13px;line-height:1.5;padding:22px 20px 26px;border-radius:4px;box-shadow:0 1px 0 var(--line),0 8px 24px rgb(0 0 0 / .08);position:relative;max-width:420px;width:100%;justify-self:center}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 6px 0,transparent 5px,var(--paper) 5.5px) 0 0/12px 8px repeat-x}
.ticket .c{text-align:center}
.ticket .biz{font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.ticket hr{border:0;border-top:1px dashed currentColor;opacity:.5;margin:10px 0}
.ticket .tr{display:flex;justify-content:space-between;gap:10px}
.ticket .tr span:first-child{min-width:0;overflow-wrap:anywhere}
.ticket .tot{font-weight:600;font-size:16px}
.ticket .void{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid var(--bad);color:var(--bad);font-weight:600;font-size:26px;padding:2px 14px;letter-spacing:.1em;opacity:.8}

/* Notas */
.notes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:20px;align-items:start}
@media (max-width:860px){.notes{grid-template-columns:minmax(0,1fr)}}
.nrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;background:var(--surface);width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.nrow:first-child{border-top:0}
.nrow:hover{background:var(--surface-2)}
.nrow[aria-current="true"]{background:var(--accent-soft)}
.nrow .fol{font-family:var(--f-mono);font-weight:600}
.nrow .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .who small{display:block;color:var(--muted);font-size:12px}
.nrow.voided .fol,.nrow.voided .amt{text-decoration:line-through;color:var(--muted)}
.ticket-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
.settings{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.settings label.f{flex:1 1 180px}

<script>
(() => {
// ---------- estado ----------
const S = {
  products: [], notes: [], users: [],
  settings: { negocio: "Mi negocio", moneda: "S/" },
  view: "inventario", group: "categoria", q: "", lowOnly: false,
  selNote: null, online: false, loaded: false,
};
let db = null, downloads = null;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n2 = v => Number.isFinite(+v) ? +v : 0;
const money = v => S.settings.moneda + " " + n2(v).toLocaleString("es", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qty = v => n2(v).toLocaleString("es", { maximumFractionDigits: 3 });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const folioTxt = f => "NV-" + String(f).padStart(5, "0");
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("es", { day: "2-digit", month: "2-digit", year: "numeric" }) + " " + d.toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" }); };
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

let toastT;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}

// ---------- semejanza ----------
const STOP = new Set("de la el los las del con sin para por en y x un una al tipo marca".split(" "));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
const stem = t => t.length > 4 ? t.replace(/(es|s)$/, "").slice(0, 6) : t;
function tokens(s) { return norm(s).split(" ").filter(t => t.length > 1 && !STOP.has(t) && !/\d/.test(t)).map(stem); }
function grams(s) { const t = "  " + norm(s) + " "; const g = new Set(); for (let i = 0; i < t.length - 2; i++) g.add(t.slice(i, i + 3)); return g; }
const simCache = new Map();
function feat(p) {
  const key = p.nombre;
  if (!simCache.has(key)) simCache.set(key, { tk: new Set(tokens(key)), gr: grams(key), first: tokens(key)[0] || "" });
  return simCache.get(key);
}
function similarity(a, b) {
  const A = feat(a), B = feat(b);
  let inter = 0; A.tk.forEach(t => B.tk.has(t) && inter++);
  const uni = A.tk.size + B.tk.size - inter;
  const jac = uni ? inter / uni : 0;
  let gi = 0; A.gr.forEach(g => B.gr.has(g) && gi++);
  const dice = (A.gr.size + B.gr.size) ? (2 * gi) / (A.gr.size + B.gr.size) : 0;
  let s = Math.max(jac, dice * 0.9);
  if (A.first && A.first === B.first) s = Math.max(s, 0.55);
  return Math.min(1, s);
}
function mostSimilar(name, excludeId, limit = 3) {
  if (!norm(name)) return [];
  const probe = { nombre: name };
  return S.products.filter(p => p.id !== excludeId)
    .map(p => ({ p, s: similarity(probe, p) }))
    .filter(x => x.s >= 0.3).sort((a, b) => b.s - a.s).slice(0, limit);
}
function clusters(list) {
  const TH = 0.45, groups = [];
  [...list].sort((a, b) => norm(a.nombre).localeCompare(norm(b.nombre))).forEach(p => {
    let best = null, bs = 0;
    for (const g of groups) for (const m of g) { const s = similarity(p, m); if (s > bs) { bs = s; best = g; } }
    if (best && bs >= TH) best.push(p); else groups.push([p]);
  });
  const named = groups.filter(g => g.length > 1).map(g => {
    const freq = {}, orig = {};
    g.forEach(p => { const seen = new Set(); norm(p.nombre).split(" ").forEach(w => { if (w.length < 2 || STOP.has(w) || /\d/.test(w)) return; const k = stem(w); if (seen.has(k)) return; seen.add(k); freq[k] = (freq[k] || 0) + 1; orig[k] = orig[k] || w; }); });
    const top = Object.entries(freq).sort((a, b) => b[1] - a[1])[0];
    const label = top ? orig[top[0]][0].toUpperCase() + orig[top[0]].slice(1) : "Grupo";
    return { label: "Familia «" + label + "»", items: g };
  }).sort((a, b) => b.items.length - a.items.length);
  const singles = groups.filter(g => g.length === 1).flat();
  if (singles.length) named.push({ label: "Sin productos parecidos", items: singles, quiet: true });
  return named;
}

// ---------- datos ----------
const mem = { products: new Map(), notes: new Map(), users: new Map(), settings: null };
const PERMISOS = { admin: ["*"], vendedor: ["inventario.ver", "venta.crear", "nota.ver", "nota.imprimir"] };
let sessionId = null;
let saleAdjusting = false;
let failedLogins = 0;
let loginBlockedUntil = 0;
let audit = store.get("mostrador.audit") || [];
function usuarioActual() {
  return S.users.find(u => u.id === sessionId && u.activo) || null;
}
function puede(permiso) {
  const user = usuarioActual();
  const allowed = PERMISOS[user?.rol] || [];
  return allowed.includes("*") || allowed.includes(permiso);
}
function registrarIntento(usuario, accion) {
  audit.unshift({ fecha: new Date().toISOString(), usuario: String(usuario || ""), accion });
  audit = audit.slice(0, 50);
  store.set("mostrador.audit", audit);
}
function exigir(permiso, accion) {
  if (puede(permiso)) return true;
  // sin sesión (pantalla de inicio o arranque) no hay nadie a quien avisar ni registrar
  if (!usuarioActual()) return false;
  registrarIntento(usuarioActual()?.usuario || "sesión", accion);
  toast("No tienes permiso para " + accion);
  return false;
}
async function hashPin(salt, pin) {
  if (!crypto.subtle) throw new Error("Este navegador no ofrece SHA-256 seguro. No se pueden crear usuarios.");
  const bytes = new TextEncoder().encode(salt + pin);
  const hash = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function makeSalt() {
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return [...bytes].map(b => b.toString(16).padStart(2, "0")).join("");
}
function storeSession(id) {
  try {
    if (id) sessionStorage.setItem("mostrador.session", id);
    else sessionStorage.removeItem("mostrador.session");
  } catch {}
}
async function crearUsuario(input) {
  if (!crypto.subtle) throw new Error("Este navegador no ofrece SHA-256 seguro. No se pueden crear usuarios.");
  const usuario = input.usuario.trim().toLowerCase();
  if (!usuario) throw new Error("Escribe un usuario.");
  if (S.users.some(u => u.usuario === usuario)) throw new Error("Ese usuario ya existe.");
  const salt = makeSalt();
  const pinHash = await hashPin(salt, input.pin);
  const user = {
    id: uid(), nombre: input.nombre.trim(), usuario,
    rol: input.rol, activo: true, salt, pinHash,
    creado: new Date().toISOString(),
  };
  S.users.push(user);
  await putUsers();
  return user;
}
async function iniciarSesion(usuario, pin) {
  if (Date.now() < loginBlockedUntil) {
    const seconds = Math.ceil((loginBlockedUntil - Date.now()) / 1000);
    renderLogin("Demasiados intentos. Espera " + seconds + " s antes de volver a intentar.");
    return false;
  }
  const user = S.users.find(u => u.usuario === usuario.trim().toLowerCase());
  if (user && !user.activo) {
    renderLogin("Usuario desactivado; habla con el administrador");
    return false;
  }
  const valid = user && await hashPin(user.salt, pin) === user.pinHash;
  if (!valid) {
    failedLogins++;
    if (failedLogins >= 5) {
      loginBlockedUntil = Date.now() + 30000;
      failedLogins = 0;
    }
    renderLogin("Usuario o PIN incorrecto");
    return false;
  }
  sessionId = user.id;
  storeSession(sessionId);
  failedLogins = 0;
  renderApp();
  return true;
}
function cerrarSesion() {
  sessionId = null;
  storeSession(null);
  renderLogin();
}
function renderLogin(error = "") {
  document.querySelector("header.top").hidden = true;
  document.querySelector("main.wrap").hidden = true;
  let el = $("#authScreen");
  if (!el) {
    el = document.createElement("div");
    el.id = "authScreen";
    el.className = "auth-screen";
    document.body.append(el);
  }
  const first = !S.users.length;
  const nameField = first ? '<label class="f"><span>Nombre</span><input name="nombre" required></label>' : "";
  const confirmField = first ? '<label class="f"><span>Confirmar PIN</span><input name="confirmacion" type="password" minlength="4" maxlength="12" required></label>' : "";
  const title = first ? "Crear administrador" : "Iniciar sesión";
  el.innerHTML = '<form class="auth-card" id="authForm"><h1>' + title + '</h1>' + nameField +
    '<label class="f"><span>Usuario</span><input name="usuario" autocomplete="username" required></label>' +
    '<label class="f"><span>PIN</span><input name="pin" type="password" minlength="4" maxlength="12" autocomplete="current-password" required></label>' +
    confirmField + '<p class="warnline">' + esc(error) + '</p><button class="btn primary" type="submit">' + title + '</button></form>';
  $("#authForm").onsubmit = async e => {
    e.preventDefault();
    const data = new FormData(e.currentTarget);
    const usuario = String(data.get("usuario"));
    const pin = String(data.get("pin"));
    if (!first) return iniciarSesion(usuario, pin);
    if (pin.length < 4 || pin.length > 12 || pin !== data.get("confirmacion")) {
      return renderLogin("El PIN debe tener 4 a 12 caracteres y coincidir.");
    }
    try {
      const user = await crearUsuario({ nombre: data.get("nombre"), usuario, pin, rol: "admin" });
      sessionId = user.id;
      storeSession(sessionId);
      renderApp();
    } catch (err) {
      renderLogin(err.message);
    }
  };
}
function aplicarPermisosUI() {
  const admin = puede("usuarios.gestionar");
  document.querySelectorAll('[data-view="ventas"],[data-view="resumen"],[data-view="usuarios"]')
    .forEach(button => button.hidden = !admin);
  $("#userMenu").hidden = false;
  const user = usuarioActual();
  const role = user?.rol === "admin" ? "Administrador" : "Vendedor";
  $("#userMenu").innerHTML = '<b>' + esc(user?.nombre || "") + '</b><span class="chip">' + role +
    '</span><button class="btn" id="logout">Cerrar sesión</button>';
  $("#logout").onclick = cerrarSesion;
}
function renderApp() {
  if (!usuarioActual()) return renderLogin();
  $("#authScreen")?.remove();
  document.querySelector("header.top").hidden = false;
  document.querySelector("main.wrap").hidden = false;
  aplicarPermisosUI();
  go(S.view);
}
async function putUsers() { if (db) await db.doc("settings/users").set({ list: S.users }); else { mem.users = new Map(S.users.map(u => [u.id, u])); syncMem(); } }
async function putProduct(p) {
  if (!exigir(editing ? "producto.editar" : "producto.crear", "guardar productos")) return;
  const body = { ...p }; delete body.id;
  if (db) await db.collection("products").doc(p.id).set(body);
  else { mem.products.set(p.id, { ...p }); syncMem(); }
}
async function patchProduct(id, patch) {
  if (!saleAdjusting && (Object.prototype.hasOwnProperty.call(patch, "stock") || Object.prototype.hasOwnProperty.call(patch, "variantes"))) { if (!exigir("stock.ajustar", "ajustar stock")) return; }
  if (db) await db.collection("products").doc(id).update(patch);
  else { const p = mem.products.get(id); if (p) Object.assign(p, patch); syncMem(); }
}
async function readProduct(id) {
  if (db) {
    const snap = await db.collection("products").doc(id).get();
    return snap.exists ? { id, ...snap.data() } : null;
  }
  const p = mem.products.get(id);
  return p ? { ...p, variantes: p.variantes?.map(v => ({ ...v })) } : null;
}
async function removeProduct(id) {
  if (!exigir("producto.eliminar", "eliminar productos")) return;
  if (db) await db.collection("products").doc(id).delete();
  else { mem.products.delete(id); syncMem(); }
}
async function putNote(n) {
  if (n.estado === "anulada" && !exigir("nota.anular", "anular notas")) return;
  const body = { ...n }; delete body.id;
  if (db) await db.collection("notes").doc(n.id).set(body);
  else { mem.notes.set(n.id, { ...n }); syncMem(); }
}
async function deleteNote(id) {
  if (db) await db.collection("notes").doc(id).delete();
  else { mem.notes.delete(id); syncMem(); }
}
async function putSettings(s) {
  if (!exigir("ajustes.editar", "editar ajustes")) return;
  if (db) await db.doc("settings/app").set(s);
  else { mem.settings = s; S.settings = { ...S.settings, ...s }; syncMem(); }
}
function syncMem() {
  S.products = [...mem.products.values()]; S.notes = [...mem.notes.values()]; S.users = [...mem.users.values()];
  if (!db) {
    try { localStorage.setItem("mostrador.data", JSON.stringify({ products: S.products, notes: S.notes, users: S.users, settings: S.settings })); }
    catch { const b = $("#banner"); b.textContent = "No se pudo guardar en este navegador. Exporta una copia y libera espacio."; b.hidden = false; }
  }
  simCache.clear(); renderAll();
}
function failMsg(e) {
  const c = e && e.code;
  if (c === "invalid_argument") return "No tienes permiso para guardar cambios en esta app.";
  if (c === "quota_exceeded") return "El almacén está lleno. Elimina notas o productos antiguos.";
  return "No se pudo guardar. Revisa tu conexión e inténtalo otra vez.";
}

// ---------- inventario ----------
const pendingStock = new Map();
const stockWrites = new Set();
const totalStock = p => Array.isArray(p.variantes) && p.variantes.length ? p.variantes.reduce((a,v)=>a+n2(v.stock),0) : n2(p.stock);
function scheduleStockDelta(id, variantId, delta) {
  const key = id + ":" + (variantId || "");
  const old = pendingStock.get(key);
  if (old) clearTimeout(old.timer);
  // si el guardado anterior ya está en curso, su delta no se vuelve a sumar
  const entry = { delta: (old && !old.promise ? old.delta : 0) + delta, timer: null };
  entry.timer = setTimeout(() => flushStockDelta(key).catch(e => toast(failMsg(e))), 450);
  pendingStock.set(key, entry);
}
async function flushStockDelta(key) {
  const entry = pendingStock.get(key); if (!entry) return;
  if (entry.promise) return entry.promise;
  clearTimeout(entry.timer);
  entry.promise = (async () => {
    const [id, variantId] = key.split(":");
    // en modo local la pantalla y los datos son el mismo objeto: el valor ya está aplicado, solo falta guardarlo
    if (!db) { syncMem(); return; }
    const p = await readProduct(id); if (!p) return;
    if (variantId) {
      const v = (p.variantes || []).find(x => x.id === variantId); if (!v) return;
      v.stock = Math.max(0, Math.round((n2(v.stock) + entry.delta) * 1000) / 1000);
      p.stock = totalStock(p);
      await patchProduct(id, { variantes: p.variantes, stock: p.stock, actualizado: new Date().toISOString() });
    } else {
      p.stock = Math.max(0, Math.round((n2(p.stock) + entry.delta) * 1000) / 1000);
      await patchProduct(id, { stock: p.stock, actualizado: new Date().toISOString() });
    }
  })();
  stockWrites.add(entry.promise);
  entry.promise.then(() => stockWrites.delete(entry.promise), () => stockWrites.delete(entry.promise));
  try { await entry.promise; }
  finally { if (pendingStock.get(key) === entry) pendingStock.delete(key); }
}
async function flushPendingStock() {
  while (pendingStock.size || stockWrites.size) {
    const pending = [...pendingStock.keys()].map(key => flushStockDelta(key));
    await Promise.all([...pending, ...stockWrites]);
  }
}
function setStockLocal(id, value) {
  if (!exigir("stock.ajustar", "ajustar stock")) return;
  const p = S.products.find(x => x.id === id); if (!p) return;
  const previous = n2(p.stock);
  p.stock = value;
  scheduleStockDelta(id, null, value - previous);
}
function setVariantStock(id, variantId, value) {
  if (!exigir("stock.ajustar", "ajustar stock")) return;
  const p=S.products.find(x=>x.id===id), v=p&&p.variantes&&p.variantes.find(x=>x.id===variantId); if(!v)return;
  const previous = n2(v.stock);
  v.stock=value; p.stock=totalStock(p);
  scheduleStockDelta(id, variantId, value - previous);
}

function renderInventario() {
  const el = $("#v-inventario");
  const prods = S.products;
  const q = norm(S.q);
  let list = prods.filter(p => !q || norm(p.nombre + " " + (p.categoria || "") + " " + (p.codigo || "") + " " + (p.variantes||[]).map(v=>[v.talla,v.color,v.codigo].join(" ")).join(" ")).includes(q));
  if (S.lowOnly) list = list.filter(p => p.variantes&&p.variantes.length ? p.variantes.some(v=>n2(v.stock)<=n2(v.minimo??p.minimo)) : n2(p.stock) <= n2(p.minimo));
  const units = prods.reduce((a, p) => a + Math.max(0, totalStock(p)), 0);
  const value = prods.reduce((a, p) => a + (p.variantes && p.variantes.length
    ? p.variantes.reduce((b, v) => b + Math.max(0, n2(v.stock)) * n2(v.precio ?? p.precio), 0)
    : Math.max(0, n2(p.stock)) * n2(p.precio)), 0);

function rowHtml(p) {

async function exportBackup() {
  if (!exigir("datos.exportar", "exportar copias")) return;
  const data = JSON.stringify({ version: 1, products: S.products, notes: S.notes, users: S.users, settings: S.settings }, null, 2);
  const name = "mostrador-copia-" + new Date().toISOString().slice(0, 10) + ".json";
  if (downloads) return saveFile(name, data);
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let pendingBackup = null;
async function importBackup(file) {
  if (!exigir("datos.importar", "importar copias")) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.products) || !Array.isArray(data.notes) || !data.settings || typeof data.settings !== "object" || (data.users !== undefined && !Array.isArray(data.users))) throw new Error("Formato inválido");
    pendingBackup = data;
    const dialog = $("#backupDialog");
    dialog.returnValue = ""; dialog.showModal();
    dialog.onclose = async () => {
      const mode = dialog.returnValue; const incoming = pendingBackup; pendingBackup = null;
      if (!incoming || !["merge", "replace"].includes(mode)) return;
      try {
        if (mode === "replace") {
          if (db) {
            await Promise.all(S.products.map(p => removeProduct(p.id)));
            await Promise.all(S.notes.map(n => db.collection("notes").doc(n.id).delete()));
          } else { mem.products.clear(); mem.notes.clear(); }
        }
        for (const p of incoming.products) if (p && p.id) await putProduct(p);
        for (const n of incoming.notes) if (n && n.id) await putNote(n);
        await putSettings(incoming.settings);
        if (Array.isArray(incoming.users)) {
          if (mode === "replace") S.users = incoming.users.filter(u => u && u.id);
          else { const merged = new Map(S.users.map(u => [u.id, u])); incoming.users.filter(u => u && u.id).forEach(u => merged.set(u.id, u)); S.users = [...merged.values()]; }
          await putUsers();
        }
        if (!db) syncMem();
        toast(mode === "replace" ? "Copia importada" : "Copia combinada");
      } catch (err) { toast(failMsg(err)); }
    };
  } catch { toast("No se pudo leer la copia. Elige un JSON de Mostrador."); }
  finally { $("#backupFile").value = ""; }
}

async function exportCsv() {
  if (!exigir("datos.exportar", "exportar CSV")) return;
  const rows = [["Nombre", "Categoría", "Código", "Unidad", "Precio", "Stock", "Mínimo", "Talla", "Color"]]
    .concat([...S.products].sort((a, b) => (a.categoria || "").localeCompare(b.categoria || "", "es") || a.nombre.localeCompare(b.nombre, "es"))
      .flatMap(p => p.variantes&&p.variantes.length ? p.variantes.map(v=>[p.nombre,p.categoria||"",v.codigo||p.codigo||"",p.unidad||"und",n2(v.precio??p.precio),n2(v.stock),n2(v.minimo??p.minimo),v.talla||"",v.color||""]) : [[p.nombre,p.categoria||"",p.codigo||"",p.unidad||"und",n2(p.precio),n2(p.stock),n2(p.minimo),"",""]]));
  const csv = "﻿" + rows.map(r => r.map(c => /[",;\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(",")).join("\n");
  await saveFile("inventario-" + new Date().toISOString().slice(0, 10) + ".csv", csv);
}
async function saveFile(filename, data) {
  if (!downloads) { toast("Descargar no está disponible en esta vista."); return; }
  try { await downloads.save({ filename, data }); } catch (e) { if (e && e.code !== "declined") toast("No se pudo descargar el archivo."); }
}

async function emitNote(btn) {
  if (!exigir("venta.crear", "crear ventas")) return;
  const items = draft.items.filter(i => n2(i.cant) > 0).map(i => ({ ...i, cant: n2(i.cant), precio: n2(i.precio) }));
  if (!items.length) return;
  btn.disabled = true;
  const note = {
    id: uid(), folio: nextFolio(), fecha: new Date().toISOString(),
    cliente: draft.cliente.trim(), doc: draft.doc.trim(), obs: draft.obs.trim(),
    items, total: Math.round(items.reduce((a, i) => a + i.cant * i.precio, 0) * 100) / 100, estado: "emitida",
  };
  try {
    await flushPendingStock();
    const freshNotes = await readNotes();
    note.folio = nextFreeFolio(freshNotes);
    note.vendedorId = usuarioActual()?.id;
    note.vendedorNombre = usuarioActual()?.nombre;
    saleAdjusting = true;
    const changed = await adjustStock(items, -1);
    try {
      const latestNotes = await readNotes();
      if (latestNotes.some(n => n2(n.folio) === n2(note.folio))) note.folio = nextFreeFolio(latestNotes);
      await putNote(note);
    }
    catch (err) {
      await restoreProducts(changed);
      try { await deleteNote(note.id); } catch {}
      throw err;
    }
    saleAdjusting = false;
    draft = blankDraft(); saveDraft();
    S.selNote = note.id;
    toast("Nota " + folioTxt(note.folio) + " emitida");
    go("notas");
  } catch (err) { saleAdjusting = false; toast("No se pudo emitir la nota; se revirtieron los cambios. " + failMsg(err)); btn.disabled = false; }
}
async function readNotes() {
  if (db) { const snap = await db.collection("notes").get(); return snap.docs.map(d => ({ id: d.id, ...d.data() })); }
  return [...mem.notes.values()].map(n => ({ ...n }));
}
function nextFreeFolio(notes) {
  const used = new Set(notes.map(n => n2(n.folio)));
  let folio = notes.reduce((m, n) => Math.max(m, n2(n.folio)), 0) + 1;
  while (used.has(folio)) folio++;
  return folio;
}
async function restoreProducts(snapshots) {
  for (const p of snapshots) {
    const body = { ...p }; delete body.id;
    if (db) await db.collection("products").doc(p.id).set(body);
    else { mem.products.set(p.id, { ...p }); syncMem(); }
  }
}
async function adjustStock(items, sign) {
  const byKey = {};
  items.forEach(i => { if (i.productId) {const key=i.productId+":"+(i.variantId||"");byKey[key]=(byKey[key]||0)+n2(i.cant);} });
  const snapshots = [];
  for (const key of Object.keys(byKey)) {
    const [id, vid] = key.split(":"), p = await readProduct(id);
    if (!p || (vid && !(p.variantes || []).some(v => v.id === vid))) throw new Error("Producto o variante no disponible");
  }
  try {
    for (const [key, c] of Object.entries(byKey)) {
      const [id, vid] = key.split(":"), p = await readProduct(id);
      snapshots.push(structuredClone(p));
      if (vid) {
        const v = p.variantes.find(x => x.id === vid);
        v.stock = Math.round((n2(v.stock) + sign * c) * 1000) / 1000; p.stock = totalStock(p);
        await patchProduct(id, { variantes: p.variantes, stock: p.stock, actualizado: new Date().toISOString() });
      } else {
        p.stock = Math.round((n2(p.stock) + sign * c) * 1000) / 1000;
        await patchProduct(id, { stock: p.stock, actualizado: new Date().toISOString() });
      }
    }
  } catch (err) { await restoreProducts(snapshots); throw err; }
  return snapshots;
}

function ticketText(n) {
  const W = 36, pad = (l, r) => { l = String(l); r = String(r); const sp = W - l.length - r.length; return sp >= 1 ? l + " ".repeat(sp) + r : l + "\n" + " ".repeat(Math.max(0, W - r.length)) + r; };
  const ctr = s => { s = String(s); const p = Math.max(0, Math.floor((W - s.length) / 2)); return " ".repeat(p) + s; };
  const hr = "-".repeat(W);
  const L = [ctr(S.settings.negocio.toUpperCase()), ctr("NOTA DE VENTA"), ctr(folioTxt(n.folio)), hr,
    "Fecha: " + fmtDate(n.fecha), "Cliente: " + (n.cliente || "Público en general")];
  if (n.vendedorNombre) L.push("Atendió: " + n.vendedorNombre);
  if (n.doc) L.push("Doc.: " + n.doc);
  L.push(hr);
  n.items.forEach(i => { L.push(pad(qty(i.cant) + " " + (i.unidad || "und") + " " + i.nombre, money(i.cant * i.precio))); L.push("   " + money(i.precio) + " c/u"); });
  L.push(hr, pad("TOTAL", money(n.total)));
  if (n.obs) L.push(hr, "Obs.: " + n.obs);
  if (n.estado === "anulada") L.push(hr, ctr("*** NOTA ANULADA ***"));
  L.push(hr, ctr("Gracias por su compra"));
  return L.join("\n");
}

function canPrintLocally() { return !db; }
// Bloquea dobles clics mientras se prepara la impresión, pero nunca para siempre:
// el bloqueo se libera al volver de print() o, como respaldo, a los 15 s.
let printingFrame = null, printingSince = 0;
function printLocal(n, button) {
  if (printingFrame && Date.now() - printingSince < 15000) return;
  // Un iframe de una impresión anterior que no avisó afterprint se quita al empezar otra.
  document.querySelectorAll("iframe[data-ticket-print]").forEach(f => f.remove());
  const w = S.settings.papel === "58" ? 58 : 80;
  const frame = document.createElement("iframe");
  frame.dataset.ticketPrint = "1";
  printingFrame = frame; printingSince = Date.now();
  if (button) button.disabled = true;
  frame.title = "Impresión de ticket";
  frame.style.cssText = `position:fixed;left:-10000px;top:0;width:${w}mm;height:1000px;border:0;visibility:visible`;
  let started = false;
  const unlock = () => {
    if (printingFrame === frame) printingFrame = null;
    if (button) button.disabled = false;
  };
  const finish = () => { frame.remove(); unlock(); };
  frame.onload = () => {
    if (started || !frame.contentDocument || !frame.contentDocument.querySelector(".ticket")) return;
    started = true;
    const win = frame.contentWindow, doc = frame.contentDocument;
    win.addEventListener("afterprint", finish, { once: true });
    Promise.resolve(doc.fonts && doc.fonts.ready).then(() => new Promise(resolve => {
      if (win.requestAnimationFrame) win.requestAnimationFrame(() => setTimeout(resolve, 50));
      else setTimeout(resolve, 100);
    })).then(() => {
      if (printingFrame !== frame) return;
      win.focus();
      win.print();
      // Chrome y Edge vuelven de print() al cerrar la vista previa; el iframe se queda hasta afterprint.
      setTimeout(unlock, 500);
    }).catch(finish);
  };
  frame.onerror = finish;
  frame.srcdoc = printHtml(n, false);
  document.body.append(frame);
}

  return `<div class="dash-grid"><section class="dash-card"><div class="dash-heading"><h2>Productos más vendidos</h2><span class="sales-top-toggle"><button data-sales-mode="units" aria-pressed="${salesTopMode==="units"}">Unidades</button><button data-sales-mode="amount" aria-pressed="${salesTopMode==="amount"}">Ingresos</button></span></div>${productRows?`<div class="bars">${productRows}</div>`:empty}</section><section class="dash-card"><div class="dash-heading"><h2>Tallas y colores más vendidos</h2><span class="dash-subtitle">${data.variants?"por unidades":"por categoría · unidades"}</span></div>${detailRows?`<div class="bars">${detailRows}</div>`:empty}</section></div>`;
}
function renderSalesTable(notes) {
  const query=norm(salesQ),rows=notes.filter(n=>!query||norm([folioTxt(n.folio),n.cliente,...n.items.map(i=>i.nombre)].join(" ")).includes(query));
  rows.sort((a,b)=>{
    let v=0;
    if(salesSort==="folio")v=n2(a.folio)-n2(b.folio);
    else if(salesSort==="cliente")v=String(a.cliente||"").localeCompare(String(b.cliente||""),"es");
    else if(salesSort==="total")v=n2(a.total)-n2(b.total);
    else if(salesSort==="productos")v=a.items.map(i=>i.nombre).join(" ").localeCompare(b.items.map(i=>i.nombre).join(" "),"es");
    else if(salesSort==="unidades")v=a.items.reduce((x,i)=>x+n2(i.cant),0)-b.items.reduce((x,i)=>x+n2(i.cant),0);
    else if(salesSort==="estado")v=String(a.estado||"").localeCompare(String(b.estado||""),"es");
    else v=new Date(a.fecha)-new Date(b.fecha);
    return v*salesDir;
  });
  const shown=rows.slice(0,salesLimit), columns=[["fecha","Fecha y hora"],["folio","N.º"],["cliente","Cliente"],["productos","Productos"],["unidades","Unidades"],["total","Total"],["estado","Estado"]];
  const body=shown.map(n=>{const summary=n.items.map(i=>{
    // el nombre de la línea ya trae " – talla / color" desde Nueva venta; solo se agrega si falta
    const variant=[i.talla,i.color].filter(Boolean).join(" / ");
    const name=i.nombre||"Producto";
    return `${name}${variant&&!name.includes(variant)?` – ${variant}`:""} ×${qty(i.cant)}`;
  }).join(", "),units=n.items.reduce((a,i)=>a+n2(i.cant),0),voided=n.estado==="anulada";return `<tr data-sales-note="${esc(n.id)}"><td class="${voided?"voided":""}">${esc(fmtDate(n.fecha))}</td><td class="${voided?"voided":""}">${esc(folioTxt(n.folio))}</td><td class="${voided?"voided":""}">${esc(n.cliente||"Público en general")}</td><td class="${voided?"voided":""}" title="${esc(summary)}"><span class="sales-summary">${esc(summary)}</span></td><td class="num ${voided?"voided":""}">${qty(units)}</td><td class="num ${voided?"voided":""}">${money(n.total)}</td><td><span class="chip ${voided?"out":""}">${voided?"Anulada":"Emitida"}</span></td></tr>`;}).join("");
  // las anuladas se muestran en la tabla pero no suman, igual que en los indicadores
  const units=notes.reduce((a,n)=>a+(n.estado==="anulada"?0:n.items.reduce((b,i)=>b+n2(i.cant),0)),0),total=notes.reduce((a,n)=>a+(n.estado==="anulada"?0:n2(n.total)),0);
  return `<div class="toolbar"><h2 style="margin-right:auto">Todas las ventas</h2><input class="grow" type="search" id="salesSearch" placeholder="Buscar cliente, folio o producto" value="${esc(salesQ)}"><button class="btn" id="salesExport">Exportar CSV</button></div><div class="summary-table-wrap"><table class="summary-table sales-table"><thead><tr>${columns.map(([key,title])=>`<th><button data-sales-sort="${key}">${title}${salesSort===key?(salesDir===1?" ↑":" ↓"):""}</button></th>`).join("")}</tr></thead><tbody>${body||`<tr><td colspan="7" class="sales-empty">Aún no hay ventas en este período. <button class="btn primary" data-view="venta">Nueva venta</button></td></tr>`}</tbody><tfoot><tr><td colspan="4">Totales del período</td><td class="num">${qty(units)}</td><td class="num">${money(total)}</td><td></td></tr></tfoot></table></div>${shown.length<rows.length?`<div class="toolbar" style="justify-content:center;margin-top:12px"><button class="btn" id="salesMore">Mostrar más</button></div>`:""}`;
}
function renderVentas() {
  if (!exigir("estadisticas.ver", "ver estadísticas")) return;
  const hadSearchFocus=document.activeElement&&document.activeElement.id==="salesSearch";
  const el=$("#v-ventas"),notes=salesInPeriod();
  el.innerHTML=`<div class="toolbar"><h1 style="margin-right:auto">Ventas</h1><div class="seg">${salesPeriods.map(([key,label])=>`<button data-sales-period="${key}" aria-pressed="${salesPeriod===key}">${label}</button>`).join("")}</div></div>${salesKpis(notes)}${renderSalesChart(notes)}${renderTopProducts(notes)}${renderSalesTable(notes)}`;
  if(hadSearchFocus){const input=$("#salesSearch");input.focus();input.setSelectionRange(input.value.length,input.value.length);}
}
$("#v-ventas").addEventListener("input",e=>{if(e.target.id==="salesSearch"){salesQ=e.target.value;salesLimit=25;renderVentas();}});
$("#v-ventas").addEventListener("click",e=>{const t=e.target.closest("button, tr[data-sales-note]");if(!t)return;if(t.dataset.view)return go(t.dataset.view);if(t.dataset.salesPeriod){salesPeriod=t.dataset.salesPeriod;store.set("mostrador.salesPeriod",salesPeriod);salesLimit=25;return renderVentas();}if(t.dataset.salesMode){salesTopMode=t.dataset.salesMode;return renderVentas();}if(t.dataset.salesSort){if(salesSort===t.dataset.salesSort)salesDir*=-1;else{salesSort=t.dataset.salesSort;salesDir=t.dataset.salesSort==="fecha"?-1:1;}return renderVentas();}if(t.id==="salesMore"){salesLimit+=25;return renderVentas();}if(t.id==="salesExport")return exportSalesCsv(salesInPeriod());if(t.dataset.salesNote){S.selNote=t.dataset.salesNote;return go("notas");}});
async function exportSalesCsv(notes){if(!exigir("datos.exportar","exportar ventas"))return;const rows=[["Fecha","Folio","Cliente","Producto","Talla","Color","Cantidad","Precio","Importe","Estado"]];notes.forEach(n=>n.items.forEach(i=>{const productName=i.variantId?String(i.nombre||"").replace(/\s+–\s+[^–]*$/,""):i.nombre||"";rows.push([n.fecha||"",folioTxt(n.folio),n.cliente||"",productName,i.talla||"",i.color||"",n2(i.cant),n2(i.precio),n2(i.cant)*n2(i.precio),n.estado==="anulada"?"Anulada":"Emitida"]);}));const csv="\uFEFF"+rows.map(r=>r.map(v=>/[",;\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(",")).join("\n");await saveFile(`ventas-${new Date().toISOString().slice(0,10)}.csv`,csv);}

function go(view) {
  const needed = view === "ventas" || view === "resumen" ? "estadisticas.ver" : view === "usuarios" ? "usuarios.gestionar" : null;
  if (needed && !exigir(needed, "abrir " + view)) view = "inventario";
  if (!puede("inventario.ver") && view === "inventario") return;
  S.view = view;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  ["inventario", "venta", "notas", "ventas", "resumen", "usuarios"].forEach(v => $("#v-" + v).hidden = v !== view);
  try { history.replaceState(null, "", "#" + view); } catch {}
  renderAll();
  window.scrollTo({ top: 0 });
}
function renderAll() {
  $("#bizName").textContent = S.settings.negocio;
  if (S.view === "inventario") renderInventario();
  else if (S.view === "venta") renderVenta();
  else if (S.view === "resumen") renderResumen();
  else if (S.view === "ventas") renderVentas();
  else if (S.view === "usuarios") renderUsuarios();
  else renderNotas();
}

// ---------- arranque ----------
S.group = store.get("mostrador.group") || "categoria";
const h = (location.hash || "").slice(1);
if (["inventario", "venta", "notas", "ventas", "resumen", "usuarios"].includes(h)) S.view = h;
renderLogin();

(async () => {
  const c = window.claude;
  const [d, dl] = c && c.use ? await Promise.all([c.use("db").catch(() => null), c.use("downloads").catch(() => null)]) : [null, null];
  db = d; downloads = dl;
  if (!db) {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem("mostrador.data") || "null"); } catch {}
    if (saved) {
      mem.products = new Map((saved.products || []).filter(p => p && p.id).map(p => [p.id, p]));
      mem.notes = new Map((saved.notes || []).filter(n => n && n.id).map(n => [n.id, n]));
      mem.users = new Map((saved.users || []).filter(u => u && u.id).map(u => [u.id, u]));
      if (saved.settings) S.settings = { ...S.settings, ...saved.settings };
      syncMem();
    }
    S.loaded = true;
    try { sessionId = sessionStorage.getItem("mostrador.session"); } catch {}
    if (usuarioActual()) renderApp(); else renderLogin();
    const b = $("#banner");
    b.textContent = "Tus datos se guardan en este navegador. Exporta copias periódicas para respaldarlos.";
    b.hidden = false;
    return renderAll();
  }
  let gotP = false, gotN = false, gotU = false;
  const ready = () => { if (gotP && gotN && gotU) { S.loaded = true; try { sessionId = sessionStorage.getItem("mostrador.session"); } catch {} if (usuarioActual()) renderApp(); else renderLogin(); } };
  db.collection("products").onSnapshot(snap => {
    S.products = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .map(p => {
        // conserva el conteo local mientras haya un guardado pendiente del producto o de una de sus variantes
        const pending = pendingStock.has(p.id) || [...pendingStock.keys()].some(k => k.startsWith(p.id + ":"));
        const local = pending && S.products.find(x => x.id === p.id);
        return local ? { ...p, stock: local.stock, ...(local.variantes ? { variantes: local.variantes } : {}) } : p;
      });
    simCache.clear(); gotP = true; ready();
    // no redibujar mientras se escribe en el stock de una fila
    const a = document.activeElement;
    if (S.view === "inventario" && a && a.dataset && a.dataset.stk) return;
    if (dlg.open && S.view === "inventario") return;
    renderAll();
  }, () => { $("#banner").textContent = "Se perdió la conexión con el almacén. Recarga la página."; $("#banner").hidden = false; });
  db.collection("notes").onSnapshot(snap => {
    S.notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    gotN = true; ready(); renderAll();
  }, () => {});
  db.doc("settings/app").onSnapshot(s => { if (s.exists) { S.settings = { ...S.settings, ...s.data() }; renderAll(); } }, () => {});
  db.doc("settings/users").onSnapshot(s => { S.users = s.exists ? (s.data().list || []) : []; gotU = true; ready(); }, () => { gotU = true; ready(); });
})();
})();
</script>
