<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mostrador</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d6e5f">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mostrador">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra superior con pestañas; cada vista es una columna de trabajo, la nota de venta se ve como ticket de papel */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#e3e9e5; --line:#cdd7d1;
  --fg:#17231f; --muted:#5a6b64; --accent:#0d6e5f; --accent-fg:#ffffff; --accent-soft:#d3ebe5;
  --warn:#a35c00; --warn-soft:#fbe9cf; --bad:#b3261e; --bad-soft:#f9dedc; --paper:#fffef9; --paper-ink:#232220;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
  /* gráficos: colores fijos por serie; --c-prev es el mismo azul más suave para el período con que se compara */
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c-prev:#86b6ef; --c-otro:#9a9993; --up:#006300;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18221f; --surface-2:#22302b; --line:#2f3f39;
  --fg:#e3ece8; --muted:#97aaa2; --accent:#4cc3ad; --accent-fg:#06221c; --accent-soft:#183d36;
  --warn:#f0b462; --warn-soft:#3a2a12; --bad:#f2958e; --bad-soft:#3d1a18; --paper:#1f2624; --paper-ink:#e8e6df; color-scheme:dark;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c-prev:#184f95; --c-otro:#6f6e69; --up:#0ca30c}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18221f; --surface-2:#22302b; --line:#2f3f39;
  --fg:#e3ece8; --muted:#97aaa2; --accent:#4cc3ad; --accent-fg:#06221c; --accent-soft:#183d36;
  --warn:#f0b462; --warn-soft:#3a2a12; --bad:#f2958e; --bad-soft:#3d1a18; --paper:#1f2624; --paper-ink:#e8e6df; color-scheme:dark;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c-prev:#184f95; --c-otro:#6f6e69; --up:#0ca30c}

*{box-sizing:border-box}
/* fuera de claude.ai no hay reset: sin esto, .btn{display:inline-flex} mostraría botones ocultos por permisos */
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:fixed;inset:0 auto 0 0;width:220px;z-index:15;background:var(--surface);border-right:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;align-items:stretch;gap:22px;padding:20px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;display:grid;gap:2px;line-height:1.2;min-width:0}
.brand small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.mobile-menu-button,.mobile-title,.drawer-close,.drawer-backdrop{display:none}
.mobile-drawer{display:contents}
nav.tabs{display:flex;flex-direction:column;gap:4px;width:100%}
nav.tabs button{display:flex;align-items:center;gap:10px;font:600 14px var(--f-body);text-align:left;background:transparent;color:var(--muted);border:0;border-left:3px solid transparent;padding:10px 12px;min-height:40px;border-radius:6px;cursor:pointer}
nav.tabs button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-left-color:var(--accent)}
nav.tabs button:hover{background:var(--surface-2);color:var(--fg)}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}
.dash-card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.dash-card h2{font-size:16px;margin:0;display:inline}
.dash-subtitle{font-size:12.5px;color:var(--muted);margin-left:7px}
.dash-heading{margin-bottom:12px}
.dash-wide{grid-column:1/-1}
.summary-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:14px 0}
.summary-stat{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.summary-stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.summary-stat-value{font:600 clamp(18px,5vw,24px) var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.summary-stat-context{font-size:13px;color:var(--muted)}
.summary-stat.warn .summary-stat-value{color:var(--warn)}
.summary-alerts{display:grid;gap:8px}
.alert-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.alert-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-stock{white-space:nowrap;font-size:12.5px}
.alert-more{margin-top:10px}
.bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.bar-label{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{display:flex;align-items:center;gap:7px;min-width:0}
.bar{height:14px;border-radius:0 4px 4px 0;background:var(--accent);flex:none;max-width:100%}
.bar-val{white-space:nowrap;font-size:12.5px;color:var(--muted)}
.rank{color:var(--muted);margin-right:5px}
.summary-table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.summary-table{border-collapse:collapse;width:100%;min-width:760px;text-align:left}
.summary-table th,.summary-table td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
.summary-table th{font-size:12px;color:var(--muted);white-space:nowrap}
.summary-table th button{all:unset;cursor:pointer;font:inherit;color:inherit}
.summary-table th button:hover{color:var(--fg)}
.summary-table td.num{text-align:right;white-space:nowrap}
.summary-table tbody tr:last-child td{border-bottom:0}
.sales-chart-wrap{overflow-x:auto;max-width:100%}
.sales-chart{position:relative;display:grid;grid-template-columns:64px minmax(600px,1fr);min-height:230px}
.sales-axis{display:flex;flex-direction:column;justify-content:space-between;padding:0 6px 24px 0;color:var(--muted);font:11px var(--f-mono);text-align:right;white-space:nowrap}
.sales-plot{position:relative;display:flex;align-items:stretch;height:206px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent calc(50% - .5px),var(--line) calc(50% - .5px),var(--line) 50%,transparent 50%,transparent calc(100% - 1px),var(--line) calc(100% - 1px),var(--line) 100%)}
.sales-bar-col{position:relative;flex:1;min-width:10px;border-radius:4px 4px 0 0}
.sales-bar-col:hover{background:var(--surface-2)}
.sales-bar{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(72%,24px);background:var(--c1);border-radius:4px 4px 0 0}
.sales-bar.zero{height:2px;background:var(--line);border-radius:0}
.sales-bar.prev{background:var(--c-prev);width:min(84%,28px)}
/* comparando: la barra actual va delante, más angosta, con un borde del color del fondo para separarla */
.sales-chart.compara .sales-bar:not(.prev){width:min(46%,15px);box-shadow:0 0 0 2px var(--surface);clip-path:inset(-2px -2px 0 -2px)}
.sales-chart.compara .sales-bar.zero{box-shadow:none}
.sales-xlabels{display:flex;padding-left:64px;min-width:664px}
.sales-xlabels span{flex:1;min-width:10px;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap}
.sales-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sales-controls .seg button{padding:7px 9px}
.sales-table tbody tr{cursor:pointer}
.sales-table tbody tr:hover{background:var(--surface-2)}
.sales-summary{display:block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sales-table .voided{text-decoration:line-through;color:var(--muted)}
.sales-table tfoot td{font-weight:700;border-top:2px solid var(--fg)}
.sales-empty{padding:16px;color:var(--muted);text-align:center}
/* Curva de tendencia (parábola) encima de las barras */
.sales-trend-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.sales-trend-svg path{fill:none;stroke:var(--fg);opacity:.6;stroke-width:2;stroke-dasharray:6 4;stroke-linecap:round}
.sales-trend{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:14px}
.sales-trend b{display:block;margin-bottom:2px}
.sales-trend small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.sales-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.sales-legend span{display:inline-flex;align-items:center;gap:6px}
.sales-legend i{display:inline-block;width:14px;height:10px;border-radius:2px;background:var(--c1)}
.sales-legend i.prev{background:var(--c-prev)}
.sales-legend i.line{height:0;border-top:2px dashed var(--fg);opacity:.6;border-radius:0;background:none}
.sales-top-toggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:8px;vertical-align:middle}
.sales-top-toggle button{border:0;background:transparent;padding:4px 7px;color:var(--muted);font-size:11px;cursor:pointer}
.sales-top-toggle button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.sales-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sales-head .sales-top-toggle{margin-left:0}
.sales-legend-top{margin:0 0 10px}
.sales-note{margin:8px 0 0;font-size:13px}
.sales-compare{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:12px 0 0;font-size:13px;color:var(--muted)}
.sales-compare .seg button{padding:7px 10px}
.seg button:disabled{opacity:.45;cursor:default}
.delta{font-weight:600;white-space:nowrap}
.delta.up{color:var(--up)}
.delta.down{color:var(--bad)}
.delta.new{color:var(--muted);font-weight:500}
.bar.s1{background:var(--c1)}
.bar-row[data-tip]:hover .bar-label{color:var(--fg)}
.sales-pair > :only-child{grid-column:1/-1}
.sales-pair:empty{display:none}
.wk-chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:150px;border-bottom:1px solid var(--line)}
.wk-col{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;border-radius:4px 4px 0 0}
.wk-col:hover{background:var(--surface-2)}
.wk-col i{display:block;width:min(56%,28px);background:var(--c1);border-radius:4px 4px 0 0}
.wk-col.compara i{width:min(40%,18px)}
.wk-col i.prev{background:var(--c-prev)}
.wk-col i.zero{height:2px;background:var(--line);border-radius:0}
.wk-labels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:5px;font-size:11.5px;color:var(--muted);text-align:center}
.pay-stack{display:flex;gap:2px;height:16px;margin:2px 0 14px}
.pay-stack span{min-width:4px;border-radius:2px}
.pay-stack span:first-child{border-radius:4px 2px 2px 4px}
.pay-stack span:last-child{border-radius:2px 4px 4px 2px}
.pay-stack span:only-child{border-radius:4px}
.pay-wrap{overflow-x:auto}
@media (max-width:480px){.pay-table .notas{display:none}}
.pay-table{width:100%;border-collapse:collapse;font-size:13px}
.pay-table th,.pay-table td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.pay-table th{font-size:12px;font-weight:600;color:var(--muted)}
.pay-table .num{text-align:right;font-variant-numeric:tabular-nums}
.pay-table tbody tr:last-child td{border-bottom:0}
.pay-table tbody tr:hover{background:var(--surface-2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px}
.chart-tip{position:fixed;z-index:60;pointer-events:none;max-width:280px;background:var(--fg);color:var(--bg);font-size:12.5px;line-height:1.45;padding:7px 10px;border-radius:8px;white-space:pre-line;box-shadow:0 4px 14px rgb(0 0 0 / .2)}
.table-stock{display:inline-flex;align-items:center;justify-content:flex-end;gap:8px}
.table-stock-bar{width:60px;height:6px;border-radius:4px;background:var(--accent);opacity:.35;flex:none}
.variant-detail{padding:5px 10px 9px 28px!important;color:var(--muted);font-size:13px}
.heat-wrap{overflow-x:auto;max-width:100%}
.heat-table{border-collapse:separate;border-spacing:2px;min-width:max-content;text-align:center}
.heat-table th,.heat-table td{padding:7px 9px;border-radius:4px;white-space:nowrap}
.heat-table th{font-size:12px;color:var(--muted);font-weight:600}
.heat-cell{font:12.5px var(--f-mono);font-variant-numeric:tabular-nums}
.heat-zero{background:var(--surface)!important;color:var(--bad);outline:1px dotted var(--bad)}
.heat-missing{color:var(--muted)}
.heat-total{font-weight:700}
.heat-legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--muted)}
.heat-swatch{width:18px;height:12px;border-radius:2px;border:1px solid var(--line)}
@media(max-width:899px){
  header.top{position:fixed;inset:env(safe-area-inset-top,0px) 0 auto;width:100%;height:56px;z-index:25;border:0;border-bottom:1px solid var(--line)}
  header.top .wrap{height:100%;max-width:none;display:flex;flex-direction:row;align-items:center;gap:12px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px))}
  .mobile-menu-button{display:inline-flex!important;width:44px;height:44px;align-items:center;justify-content:center;flex:none;border:0;border-radius:8px;background:transparent;color:var(--fg);font-size:24px;cursor:pointer}
  .mobile-title{display:block!important;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 19px var(--f-display)}
  header.top .mobile-drawer{position:fixed;inset:0 auto 0 0;z-index:31;width:min(280px,82vw);height:100dvh;display:flex;flex-direction:column;align-items:stretch;gap:0;overflow-y:auto;background:var(--surface);padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));box-shadow:8px 0 28px rgb(0 0 0 / .18);transform:translateX(-105%);visibility:hidden;transition:transform .24s ease,visibility .24s}
  header.top.menu-open .mobile-drawer{transform:translateX(0);visibility:visible;box-shadow:8px 0 28px rgb(0 0 0 / .18),0 0 0 100vmax rgb(0 0 0 / .48)}
  nav.tabs{position:static;inset:auto;z-index:auto;width:100%;height:auto;display:flex;flex-direction:column;gap:4px;overflow:visible;background:transparent;padding:0;box-shadow:none;transform:none;visibility:visible;transition:none}
  nav.tabs button{display:flex;align-items:center;gap:12px;width:100%;height:48px;min-height:48px;padding:0 12px;border:0;border-left:3px solid transparent;border-radius:6px;text-align:left;font-size:14px;white-space:nowrap}
  nav.tabs button[aria-selected="true"]{border-left-color:var(--accent)}
  nav.tabs button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .drawer-head{display:flex!important;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 16px}
  .drawer-brand{display:grid;gap:2px;font:700 20px var(--f-display)}
  .drawer-brand small{font:500 13px var(--f-body);color:var(--muted)}
  .drawer-close{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:8px;background:transparent;color:var(--fg);font-size:24px;cursor:pointer}
  .drawer-backdrop{display:none;position:fixed;inset:0;z-index:20;border:0;background:transparent}
  header.top.menu-open~.drawer-backdrop{display:block}
  header.top .user-menu{width:100%;margin-top:auto}
  header.top .install-app{width:100%;text-align:left;margin-top:10px}
  header.top .drawer-head{margin-bottom:2px}
}
@media(max-width:700px){.dash-grid{grid-template-columns:minmax(0,1fr)}.dash-wide{grid-column:auto}.summary-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.bar-row{grid-template-columns:minmax(0,1fr);gap:2px}.bar-label{text-align:left}}
@media(max-width:700px){.sales-chart{grid-template-columns:64px minmax(600px,1fr)}.sales-axis{font-size:10px}.sales-top-toggle{margin-left:2px}}
main.wrap{max-width:1100px;width:calc(100% - 220px);height:100dvh;margin:0 0 0 220px;padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.banner{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=search],input[type=datetime-local],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
label.f,.pay-field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f > span,.pay-field > span{letter-spacing:.02em}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1 1 220px;min-width:0}
.pay-opts{display:flex;flex-wrap:wrap;gap:6px}
.pay-opts button{min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.pay-opts button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.bc-ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scan-row{display:flex;gap:8px;align-items:flex-end}
.scan-row label.f{flex:1;min-width:0}
.cod-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cod-vista{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;overflow:hidden}
.cod-vista svg{max-width:100%}
.var-cod-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.scan-body,.label-body{display:flex;flex-direction:column;gap:12px;padding:20px}
.scan-body h2,.label-body h2{margin:0}
.scan-video{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:4/3}
.scan-video video{width:100%;height:100%;object-fit:cover;display:block}
.scan-video::after{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:2px solid #e5484d}
#scanMsg{margin:0;min-height:2.6em;font-size:14px}
.etq-opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.etq-opts select{flex:1 1 200px;min-width:0}
.etq-todo{display:flex;flex-wrap:wrap;gap:6px}
.etq-solo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:13.5px}
.etq-solo .btn{padding:4px 10px;font-size:13px}
.var-etq{margin-top:10px}
.etq-filas{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;max-height:min(42dvh,360px);overflow:auto;min-height:80px}
.etq-filas > .muted{padding:10px;margin:0}
.etq-fila{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line)}
.etq-fila:last-child{border-bottom:0}
.etq-fila > div{min-width:0;overflow-wrap:anywhere}
.etq-fila b{display:block;font-size:14px;font-weight:600}
.etq-fila small{font-size:12px}
.etq-fila input{width:68px;flex:none}
.rep-top{margin-bottom:12px}
.rep-sub{margin:2px 0 0;font-size:13.5px}
.rep-period select{min-width:170px;border-radius:999px;padding:9px 14px}
.rep-fechas{margin-bottom:14px}
.rep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:899px){.rep-grid{grid-template-columns:minmax(0,1fr)}.rep-card{min-height:0}.rep-empty{padding:24px 0}}
.rep-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;min-height:300px}
.rep-card header{display:flex;align-items:center;gap:8px;min-height:38px}
.rep-card h2{margin:0;font-size:17px;min-width:0}
.rep-help{position:relative;flex:none;width:20px;height:20px;border:1.5px solid var(--muted);border-radius:50%;color:var(--muted);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:help}
.rep-tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.rep-tools select{padding:6px 10px;width:auto}
.rep-open{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;border-radius:8px;color:var(--muted);cursor:pointer}
.rep-open:hover,.rep-open:focus-visible{background:var(--accent-soft);color:var(--fg)}
.rep-open svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rep-body{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.rep-empty{margin:0 auto;max-width:400px;text-align:center;color:var(--muted);font-size:14px}
.rep-help:hover::after,.rep-help:focus::after,.rep-col:hover::after,.rep-col:focus-visible::after{content:attr(data-tip);position:absolute;z-index:5;background:var(--fg);color:var(--surface);font-size:12.5px;font-weight:500;line-height:1.3;padding:6px 9px;border-radius:7px;pointer-events:none}
.rep-help:hover::after,.rep-help:focus::after{top:calc(100% + 6px);left:-60px;width:min(230px,58vw);white-space:normal;text-align:left}
.rep-chart{display:flex;flex-direction:column;gap:4px;min-width:0}
.rep-max{font-size:12px;color:var(--muted)}
.rep-cols{display:flex;align-items:stretch;gap:2px;height:170px;border-top:1px dashed var(--line);border-bottom:1px solid var(--line)}
.rep-col{position:relative;flex:1 1 0;min-width:0;display:flex;align-items:flex-end;background:none;border:0;padding:0;cursor:default}
.rep-col i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.rep-col:hover i,.rep-col:focus-visible i{opacity:.75}
.rep-col:hover,.rep-col:focus-visible{background:var(--accent-soft)}
.rep-col:hover::after,.rep-col:focus-visible::after{bottom:calc(100% + 4px);left:0;white-space:nowrap}
.rep-col.der:hover::after,.rep-col.der:focus-visible::after{left:auto;right:0}
.rep-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.rep-bars{display:flex;flex-direction:column;gap:12px}
.rep-bar-txt{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:4px}
.rep-bar-txt span{min-width:0;overflow-wrap:anywhere}
.rep-bar-txt b{font-weight:600;white-space:nowrap;font-size:13px}
.rep-track{height:10px;border-radius:0 4px 4px 0;background:var(--accent-soft)}
.rep-track i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.rep-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
.rep-kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.rep-kpi b{font-size:21px;overflow-wrap:anywhere}
.rep-kpi span{font-size:13px;color:var(--muted)}
.rep-doc{margin-top:20px}
.rep-doc summary{cursor:pointer;font-weight:600;padding:10px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}

.stats{display:flex;flex-wrap:wrap;gap:8px 28px;padding:12px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.warn b{color:var(--warn)}

.group{margin-bottom:22px}
.group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.group-head .count{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.web-code{font:600 13px ui-monospace,Consolas,monospace;padding:8px 10px;border-radius:8px;background:var(--surface-2);word-break:break-all}
.chip.low{background:var(--warn-soft);color:var(--warn)}
.chip.out{background:var(--bad-soft);color:var(--bad)}
.chip.ex{background:var(--accent-soft);color:var(--fg)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 176px 104px;gap:6px 16px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row.head{padding-block:7px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted)}
.row.head .r{text-align:right}
.inv-mas{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:-8px 0 20px}
.row .estado{display:flex;justify-content:flex-start;min-width:0}
.row .estado .chip{white-space:nowrap}
.row:first-child{border-top:0}
.row .name{min-width:0}
.row .name button{all:unset;cursor:pointer;font-weight:600;overflow-wrap:anywhere}
.row .name button:hover{text-decoration:underline}
.row .meta{font-size:12.5px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row .price{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
/* Foto del producto: miniatura cuadrada; sin foto, la inicial del nombre */
.thumb{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:15px;text-transform:uppercase}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sm{width:34px;height:34px;border-radius:6px;font-size:13px}
.thumb.lg{width:84px;height:84px;border-radius:12px;font-size:26px}
.row .name.with-thumb{display:flex;gap:10px;align-items:center}
.row .name.with-thumb > div{min-width:0}
.photo-field{display:flex;gap:14px;align-items:center}
.photo-field .btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.photo-field small{flex-basis:100%;color:var(--muted);font-size:12.5px}
.counter{display:flex;align-items:center;gap:2px}
.counter button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font:600 18px var(--f-mono);line-height:1}
.counter button:hover{border-color:var(--muted)}
.counter input{width:64px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;padding:6px 4px}
.counter .u{font-size:12px;color:var(--muted);margin-left:4px;min-width:24px}
.counter > span:not(.u){min-width:64px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:620px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row.head{display:none}
  .row .price{grid-column:2;grid-row:1}
  .row .counter{grid-column:1;justify-self:start}
  .row .var-toggle{grid-column:1;justify-self:start;width:auto}
  .row .estado{grid-column:2;justify-content:flex-end}
}
/* Producto con tallas y colores: una sola fila; el detalle se abre al tocar */
.var-toggle{display:inline-flex;align-items:center;justify-content:space-between;width:100%;gap:8px;min-height:36px;padding:4px 10px 4px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.var-toggle:hover{border-color:var(--muted)}
.var-toggle b{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.var-toggle .muted{font-size:12px}
.var-toggle svg{flex:none;transition:transform .15s}
.var-toggle[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.var-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.var-panel{grid-column:1 / -1;padding:10px 0 2px}
.var-matrix-wrap{overflow-x:auto;max-width:100%}
.var-matrix{border-collapse:separate;border-spacing:3px;min-width:max-content}
.var-matrix th{font-size:12px;font-weight:600;color:var(--muted);padding:4px 8px;white-space:nowrap}
.var-matrix thead th{text-align:center}
.var-matrix tbody th{text-align:left}
.var-matrix td{min-width:52px;height:36px;padding:0;text-align:center;border-radius:6px;background:var(--surface-2);font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.var-matrix td input{width:56px;height:36px;border:0;background:transparent;text-align:center;font:inherit;color:inherit;padding:0 2px;border-radius:6px}
.var-matrix td input:focus{outline:2px solid var(--accent);outline-offset:-2px}
.var-matrix td.low{background:var(--warn-soft);color:var(--warn)}
.var-matrix td.out{background:var(--bad-soft);color:var(--bad)}
.var-matrix td.none{background:transparent;color:var(--muted);font-weight:400}
.var-matrix td.tot{background:transparent;color:var(--muted)}
.var-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 0 3px;font-size:12px;color:var(--muted)}
.var-legend span{display:inline-flex;align-items:center;gap:5px}
.var-legend i{width:10px;height:10px;border-radius:3px;background:var(--warn-soft);border:1px solid var(--warn)}
.var-legend i.out{background:var(--bad-soft);border-color:var(--bad)}
.color-tots{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.color-tots span{display:inline-flex;align-items:center;white-space:nowrap}
.color-tots b{margin-left:4px;color:var(--fg);font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums}
.color-tots .out b{color:var(--bad)}
.var-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.var-card{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.sw{display:inline-block;flex:none;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--sw,transparent);border:1px solid rgb(0 0 0 / .2)}
/* Editor: tallas y colores para tocar */
.var-pick{display:grid;gap:12px;margin-top:10px}
.var-pick-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:600}
.var-sets{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.var-sets button{border:0;background:transparent;padding:4px 9px;color:var(--muted);font-size:12px;cursor:pointer}
.var-sets button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.pick-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pick-chips button{min-width:40px;min-height:34px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.pick-chips button:hover{border-color:var(--muted)}
.pick-chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pick-chips button[aria-pressed="true"] .sw{border-color:#fff}
.pick-other{display:flex;gap:6px;margin-top:6px}
.pick-other input{flex:1;min-width:0;padding:6px 10px}
.var-rows{display:grid;gap:5px;margin-top:4px}
.var-edit{display:grid;grid-template-columns:minmax(64px,.8fr) 72px 84px minmax(150px,1.5fr) 34px;gap:6px;align-items:center}
.var-edit input{padding:6px 8px;min-width:0;width:100%}
.var-edit input[data-vfield="codigo"]{font:13px var(--f-mono);font-variant-numeric:tabular-nums}
.var-edit .var-name{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.var-edit .var-name .sw{margin-right:0;flex:none}
/* agrupadas por color: el color va en el título del grupo y cada fila solo dice la talla */
.var-group{display:flex;align-items:center;gap:8px;margin-top:10px;padding-bottom:5px;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px}
.var-group:first-child{margin-top:2px}
.var-group .sw{margin-right:0}
.var-group .muted{margin-left:auto;font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.var-rows.agrupado .var-edit:not([data-loose]) .var-name{padding-left:18px;font-weight:500}
.var-rows.agrupado .var-edit:not([data-loose]) .var-name .sw{display:none}
.pick-chips button.pick-more{border-style:dashed;color:var(--muted)}
.cat-campo{min-width:0}
.cat-campo + .f{align-self:start}
.cat-chips{margin:6px 0 4px}
.cat-chips-label{font-size:12px;font-weight:600;color:var(--muted)}
.cat-chips .pick-chips{margin-top:4px}
.pick-chips button .n{margin-left:3px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pick-chips button[aria-pressed="true"] .n{color:inherit;opacity:.8}
.var-edit .var-loose{display:flex;gap:4px;min-width:0}
.var-edit .x{width:34px;height:34px;padding:0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:15px}
.var-edit .x:hover{color:var(--bad);border-color:var(--bad)}
.var-edit.head{font-size:11.5px;color:var(--muted);font-weight:600}
@media (max-width:480px){
  .var-matrix td{min-width:42px}
  .var-matrix td input{width:44px}
  .var-matrix th{padding:4px 4px}
  /* celular: talla, stock, precio y quitar en una línea; el código debajo, a lo ancho */
  .var-edit{grid-template-columns:64px minmax(0,1fr) minmax(0,1fr) 34px;row-gap:4px}
  .var-edit:not([data-loose]) .var-name{grid-row:1 / 3;align-self:start;padding-top:8px}
  .var-edit:not([data-loose]) [data-vfield="codigo"]{grid-column:2 / 4;grid-row:2}
  .var-edit:not([data-loose]) .x{grid-column:4;grid-row:1}
  .var-edit[data-loose] > :first-child{grid-column:1 / -1}
  .var-edit[data-loose] [data-vfield="codigo"]{grid-column:1 / 4}
  .var-rows.agrupado .var-edit:not([data-loose]) .var-name{padding-left:4px}
  .var-rows{gap:0}
  .var-rows .var-edit{padding:6px 0;border-bottom:1px dashed var(--line)}
  .var-rows .var-edit:last-child,.var-rows .var-edit:has(+ .var-group){border-bottom:0}
  .var-group{margin-top:8px}
  .var-edit.head{grid-template-columns:64px minmax(0,1fr) minmax(0,1fr) 34px}
  .var-edit.head span:nth-child(4){display:none}
}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);margin-bottom:6px}

/* Diálogo de producto */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--fg);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:480px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.costo-margen{margin:0;align-self:end;padding-bottom:10px;font-size:13px}
.rep-mini{margin:12px 0 6px;font-size:13px}
.similar{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.similar ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.similar li{display:flex;justify-content:space-between;gap:10px}
.similar .pct{font-family:var(--f-mono);color:var(--muted)}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions .r{display:flex;gap:8px;margin-left:auto}

/* Venta */
.sale{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.sale{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.picker{position:relative}
.results{border:1px solid var(--line);border-radius:8px;margin-top:6px;max-height:280px;overflow:auto;background:var(--surface)}
.results button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer}
.results button:first-child{border-top:0}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.results small{color:var(--muted);font-size:12px}
.results.with-thumb button{grid-template-columns:34px minmax(0,1fr) auto;align-items:center}
.results.with-thumb .thumb{grid-row:span 2}
.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:minmax(0,1fr) 76px 96px 90px 30px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .nm{font-weight:600;overflow-wrap:anywhere;min-width:0}
.line .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.line input{text-align:right;font-family:var(--f-mono);padding:6px 8px}
.line .sub{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.line .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;border-radius:6px;height:30px}
.line .x:hover{color:var(--bad);background:var(--bad-soft)}
.line-head{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0;padding-bottom:2px}
@media (max-width:520px){
  .line{grid-template-columns:minmax(0,1fr) 70px 86px 26px}
  .line .sub{grid-column:1 / 4;text-align:left;font-size:13px;color:var(--muted)}
  .line .sub::before{content:"Importe: "}
  .line-head .sub{display:none}
}
.warnline{color:var(--warn);font-size:12px}
.total-row{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--fg);padding-top:10px}
.total-row b{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}

/* Ticket */
.ticket{background:var(--paper);color:var(--paper-ink);font-family:var(--f-mono);font-size:13px;line-height:1.5;padding:22px 20px 26px;border-radius:4px;box-shadow:0 1px 0 var(--line),0 8px 24px rgb(0 0 0 / .08);position:relative;max-width:420px;width:100%;justify-self:center}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 6px 0,transparent 5px,var(--paper) 5.5px) 0 0/12px 8px repeat-x}
.ticket .c{text-align:center}
.ticket .logo img{display:block;margin:0 auto 8px;max-width:60%;max-height:90px;mix-blend-mode:multiply}
.logo-pick{display:flex;align-items:center;gap:8px;min-height:40px}
.logo-pick img{height:40px;max-width:120px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px;padding:2px}
.ticket .biz{font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.ticket hr{border:0;border-top:1px dashed currentColor;opacity:.5;margin:10px 0}
.ticket .tr{display:flex;justify-content:space-between;gap:10px}
.ticket .tr span:first-child{min-width:0;overflow-wrap:anywhere}
.ticket .tot{font-weight:600;font-size:16px}
.ticket .void{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid var(--bad);color:var(--bad);font-weight:600;font-size:26px;padding:2px 14px;letter-spacing:.1em;opacity:.8}

/* Notas */
.notes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:20px;align-items:start}
@media (max-width:860px){.notes{grid-template-columns:minmax(0,1fr)}}
.nrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;background:var(--surface);width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.nrow:first-child{border-top:0}
.nrow:hover{background:var(--surface-2)}
.nrow[aria-current="true"]{background:var(--accent-soft)}
.nrow .fol{font-family:var(--f-mono);font-weight:600}
.nrow .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .who small{display:block;color:var(--muted);font-size:12px}
.nrow.voided .fol,.nrow.voided .amt{text-decoration:line-through;color:var(--muted)}
.ticket-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
.settings{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
/* Configuración */
.config-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:24px;align-items:start}
.config-form{display:grid;gap:14px}
.config-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}
.config-card h2,.config-preview h2{margin:0 0 4px;font-size:16px}
.config-card .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.config-preview{position:sticky;top:20px}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.f-label{font-size:13px;font-weight:600}
.paper-options{display:flex}
.paper-options button{flex:1;padding:12px;font-size:15px}
.config-save{justify-self:start}
@media(max-width:899px){
  .config-layout{grid-template-columns:1fr}
  .config-preview{position:static}
  .config-card .row2{grid-template-columns:1fr}
}
/* Ticket tipo boleta (también se copia en printHtml) */
.receipt-box{border:1px solid currentColor;padding:6px;margin:8px 0}
.product-head,.product-row{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto auto;gap:6px;border-bottom:1px dotted currentColor;padding:4px 0;font-size:.9em}
.product-head{font-weight:700}
.product-row>span:not(.desc){text-align:right;white-space:nowrap}
.narrow-row{display:block}
.small-detail{display:block;text-align:right}
.wrap,.desc,.amount-words{overflow-wrap:anywhere;word-break:break-word}
.amount-words{font-size:.9em;margin-top:4px}
.disclaimer{font-size:.75em;margin-top:6px;opacity:.75}
.settings label.f{flex:1 1 180px}
/* Cotizaciones y reportes: hoja A4 (el estilo de la hoja está en A4_CSS) */
.quotes{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
.quote-editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1180px){.quotes,.quote-editor{grid-template-columns:minmax(0,1fr)}}
.nrow .amt{text-align:right}
.nrow .amt small{display:block;margin-top:2px}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.a4-stage{container-type:inline-size;min-width:0}
.a4-page{max-width:210mm;margin:0 auto;padding:clamp(16px,6cqw,44px);border-radius:4px;box-shadow:0 1px 0 var(--line),0 8px 24px rgb(0 0 0 / .08)}
.report-controls{margin-bottom:16px}
.report-controls .actions{justify-content:flex-start}
/* .a4-stage delante para ganarle a A4_CSS, que se carga después */
@container (max-width:560px){
  .a4-stage .a4{font-size:11px}
  .a4-stage .a4-head{flex-direction:column}
  .a4-stage .a4-doc{text-align:left}
  .a4-stage .a4-meta{grid-template-columns:minmax(0,1fr)}
  .a4-stage .a4-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .a4-stage .a4 th,.a4-stage .a4 td{padding:6px 4px}
}
.auth-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}
.install-app{font:600 13px var(--f-body);text-align:left;background:transparent;color:var(--accent);border:1px solid var(--line);padding:8px 10px;border-radius:6px;cursor:pointer}
.user-menu{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:13px}
.auth-card h2{font-size:16px;margin:0}
.auth-card p{margin:0}
.auth-screen{overflow-y:auto}
.auth-sep{border:0;border-top:1px solid var(--line);margin:4px 0}
.caja-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:20px;align-items:start}
.caja-grid h2,.caja-hist{margin:0;font-size:16px}
.caja-hist{margin:24px 0 10px}
.caja-grid .banner{margin-bottom:0}
.caja-stats{padding:0 0 12px;margin:0}
.caja-stats .stat b{font-size:16px}
.caja-lines{display:flex;flex-direction:column;gap:6px}
.caja-lines .tr{display:flex;justify-content:space-between;gap:10px}
.caja-lines p{margin:0}
.caja-total{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.caja-actions{display:flex;justify-content:flex-end}
#c-dif{margin:0}
#c-dif:empty{display:none}
.caja-last{display:flex;flex-direction:column;gap:12px;min-width:0}
.caja-last .ticket-actions{margin-top:0}
.caja-tabla .num{text-align:right;white-space:nowrap}
.venta-caja{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:899px){.caja-grid{grid-template-columns:minmax(0,1fr)}}
.f-stack{display:grid;gap:12px}
.check{display:flex;align-items:flex-start;gap:8px;font-size:14px}
.check input{margin-top:3px}
.invite-list{display:grid;gap:8px}
.invite-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.invite-code{font-size:20px;letter-spacing:.06em}
.user-table{width:100%;border-collapse:collapse}.user-table th,.user-table td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
body{height:100dvh;overflow:hidden}
@media(max-width:899px){body{height:auto;min-height:100dvh;overflow-x:hidden;overflow-y:auto}body.menu-locked{overflow:hidden;touch-action:none}main.wrap{width:100%;max-width:none;height:auto;min-height:100dvh;margin:0;padding:calc(74px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));overflow:visible}.toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
@media(max-width:899px) and (prefers-reduced-motion:reduce){header.top .mobile-drawer{transition:none}}

<script>
(() => {
// ---------- estado ----------
const S = {
  products: [], notes: [], users: [], quotes: [], cajas: [],
  settings: { negocio: "Mi negocio", moneda: "S/" },
  view: "inventario", group: "categoria", q: "", lowOnly: false,
  selNote: null, online: false, loaded: false,
};
let db = null, downloads = null;
// fuera de claude.ai, servida por http(s), la app usa Firebase; abierta como archivo sigue guardando en el navegador
const fbMode = !window.claude && /^https?:$/.test(location.protocol);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n2 = v => Number.isFinite(+v) ? +v : 0;

// ---------- semejanza ----------
const STOP = new Set("de la el los las del con sin para por en y x un una al tipo marca".split(" "));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
const stem = t => t.length > 4 ? t.replace(/(es|s)$/, "").slice(0, 6) : t;
function tokens(s) { return norm(s).split(" ").filter(t => t.length > 1 && !STOP.has(t) && !/\d/.test(t)).map(stem); }
function grams(s) { const t = "  " + norm(s) + " "; const g = new Set(); for (let i = 0; i < t.length - 2; i++) g.add(t.slice(i, i + 3)); return g; }
const simCache = new Map();
function feat(p) {
  const key = p.nombre;
  if (!simCache.has(key)) simCache.set(key, { tk: new Set(tokens(key)), gr: grams(key), first: tokens(key)[0] || "" });
  return simCache.get(key);
}
function similarity(a, b) {
  const A = feat(a), B = feat(b);
  let inter = 0; A.tk.forEach(t => B.tk.has(t) && inter++);
  const uni = A.tk.size + B.tk.size - inter;
  const jac = uni ? inter / uni : 0;
  let gi = 0; A.gr.forEach(g => B.gr.has(g) && gi++);
  const dice = (A.gr.size + B.gr.size) ? (2 * gi) / (A.gr.size + B.gr.size) : 0;
  let s = Math.max(jac, dice * 0.9);
  if (A.first && A.first === B.first) s = Math.max(s, 0.55);
  return Math.min(1, s);
}
// Texto de búsqueda de cada producto, guardado para no volver a normalizarlo en cada tecla.
const textoCache = new WeakMap();
const ordenEs = new Intl.Collator("es");
function productoTexto(p) {
  const crudo = [p.nombre, p.categoria, p.codigo, ...(p.variantes || []).flatMap(v => [v.talla, v.color, v.codigo])].join(" ");
  const guardado = textoCache.get(p);
  if (guardado && guardado.crudo === crudo) return guardado.texto;
  const texto = norm(crudo);
  textoCache.set(p, { crudo, texto });
  return texto;
}
// todas las palabras buscadas deben estar, en cualquier orden: «polo negro» encuentra «Polo algodón Negro»
const palabrasDe = q => norm(q).split(/\s+/).filter(Boolean);
const tieneTodas = (texto, palabras) => palabras.every(w => texto.includes(w));
const CATALOGO_GRANDE = 3000; // desde aquí no se compara por parecido contra todo el catálogo
function mostSimilar(name, excludeId, limit = 3) {
  if (!norm(name)) return [];
  const probe = { nombre: name };
  const palabras = palabrasDe(name).filter(w => w.length >= 3);
  const base = S.products.length > CATALOGO_GRANDE ? S.products.filter(p => palabras.some(w => productoTexto(p).includes(w))).slice(0, 1500) : S.products;
  return base.filter(p => p.id !== excludeId)
    .map(p => ({ p, s: similarity(probe, p) }))
    .filter(x => x.s >= 0.3).sort((a, b) => b.s - a.s).slice(0, limit);
}
function clusters(list) {
  const TH = 0.45, groups = [];
  [...list].sort((a, b) => norm(a.nombre).localeCompare(norm(b.nombre))).forEach(p => {
    let best = null, bs = 0;
    for (const g of groups) for (const m of g) { const s = similarity(p, m); if (s > bs) { bs = s; best = g; } }
    if (best && bs >= TH) best.push(p); else groups.push([p]);
  });
  const named = groups.filter(g => g.length > 1).map(g => {
    const freq = {}, orig = {};
    g.forEach(p => { const seen = new Set(); norm(p.nombre).split(" ").forEach(w => { if (w.length < 2 || STOP.has(w) || /\d/.test(w)) return; const k = stem(w); if (seen.has(k)) return; seen.add(k); freq[k] = (freq[k] || 0) + 1; orig[k] = orig[k] || w; }); });
    const top = Object.entries(freq).sort((a, b) => b[1] - a[1])[0];
    const label = top ? orig[top[0]][0].toUpperCase() + orig[top[0]].slice(1) : "Grupo";
    return { label: "Familia «" + label + "»", items: g };
  }).sort((a, b) => b.items.length - a.items.length);
  const singles = groups.filter(g => g.length === 1).flat();
  if (singles.length) named.push({ label: "Sin productos parecidos", items: singles, quiet: true });
  return named;
}

async function hashPin(salt, pin) {
  if (!crypto.subtle) throw new Error("Este navegador no ofrece SHA-256 seguro. No se pueden crear usuarios.");
  const bytes = new TextEncoder().encode(salt + pin);
  const hash = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function makeSalt() {
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return [...bytes].map(b => b.toString(16).padStart(2, "0")).join("");
}
function storeSession(id) {

async function crearUsuario(input) {
  if (!crypto.subtle) throw new Error("Este navegador no ofrece SHA-256 seguro. No se pueden crear usuarios.");
  const usuario = input.usuario.trim().toLowerCase();
  if (!usuario) throw new Error("Escribe un usuario.");
  if (S.users.some(u => u.usuario === usuario)) throw new Error("Ese usuario ya existe.");
  const salt = makeSalt();
  const pinHash = await hashPin(salt, input.pin);
  const user = {
    id: uid(), nombre: input.nombre.trim(), usuario,
    rol: input.rol, activo: true, salt, pinHash,
    creado: new Date().toISOString(),
  };
  S.users.push(user);
  await putUsers();
  return user;
}
async function iniciarSesion(usuario, pin) {
  if (Date.now() < loginBlockedUntil) {
    const seconds = Math.ceil((loginBlockedUntil - Date.now()) / 1000);
    renderLogin("Demasiados intentos. Espera " + seconds + " s antes de volver a intentar.");
    return false;
  }
  const user = S.users.find(u => u.usuario === usuario.trim().toLowerCase());
  if (user && !user.activo) {
    renderLogin("Usuario desactivado; habla con el administrador");
    return false;
  }
  const valid = user && await hashPin(user.salt, pin) === user.pinHash;
  if (!valid) {
    failedLogins++;
    if (failedLogins >= 5) {
      loginBlockedUntil = Date.now() + 30000;
      failedLogins = 0;
    }
    renderLogin("Usuario o PIN incorrecto");
    return false;
  }
  sessionId = user.id;
  storeSession(sessionId);
  failedLogins = 0;
  renderApp();
  return true;
}

  const confirmField = first ? '<label class="f"><span>Confirmar PIN</span><input name="confirmacion" type="password" minlength="4" maxlength="12" required></label>' : "";
  const title = first ? "Crear administrador" : "Iniciar sesión";

    confirmField + '<p class="warnline">' + esc(error) + '</p><button class="btn primary" type="submit">' + title + '</button></form>';
  $("#authForm").onsubmit = async e => {

}

// Firebase: el nombre se reserva en negocios/{id}/nombres/{nombre normalizado} en la misma transacción que guarda
// el producto; si otro equipo reservó ese nombre un instante antes, la transacción lo ve y no se guarda.
// Sin internet, o si las reglas nuevas aún no se publicaron, se guarda como antes (queda la revisión en pantalla).
async function putProductUnico(p, anterior) {
  if (!usaTransacciones()) return putProduct(p);
  if (!exigir(anterior ? "producto.editar" : "producto.crear", "guardar productos")) return;
  const { F, fs } = fb, base = "negocios/" + fb.negocioId + "/";
  const clave = norm(p.nombre), viejaClave = anterior ? norm(anterior.nombre) : "";
  const body = { ...p }; delete body.id;
  if (navigator.onLine) {
    try {
      await F.runTransaction(fs, async tx => {
        const ref = F.doc(fs, base + "nombres/" + clave);
        const s = await tx.get(ref);
        if (s.exists() && s.data().productId !== p.id) {
          // la reserva sirve solo si su producto sigue existiendo
          const otro = await tx.get(F.doc(fs, base + "products/" + s.data().productId));
          if (otro.exists()) throw Object.assign(new Error("Nombre repetido"), { aviso: `Ya existe un producto llamado «${otro.data().nombre}». Cambia el nombre.` });
        }
        let viejaRef = null;
        if (viejaClave && viejaClave !== clave) {
          viejaRef = F.doc(fs, base + "nombres/" + viejaClave);
          const v = await tx.get(viejaRef);
          if (!v.exists() || v.data().productId !== p.id) viejaRef = null;
        }
        tx.set(ref, { productId: p.id });
        if (viejaRef) tx.delete(viejaRef);
        tx.set(F.doc(fs, base + "products/" + p.id), body);
      });
      return;
    } catch (e) {
      if (e.aviso) throw e;
      if (!sinRed(e) && !String(e && e.code).includes("permission")) throw e;
    }
  }
  // guardado sin reserva: se repasan los nombres cuando haya internet
  try { localStorage.setItem(NOMBRES_REVISAR, fb.negocioId); } catch {}
  return putProduct(p);
}
// Los productos que existían antes de las reservas (o guardados sin internet) no tienen su nombre reservado.
// Un administrador los reserva una vez por negocio; la marca settings/nombres (fuera de la colección de nombres,
// para que no pueda confundirse con ningún producto) evita volver a leer todo en cada apertura.
const NOMBRES_REVISAR = "mostrador.nombresRevisar";
let nombresRevisando = false;
async function nombresReservarExistentes() {
  if (nombresRevisando || !usaTransacciones() || !navigator.onLine || !puede("producto.editar")) return;
  nombresRevisando = true;
  const { F, fs } = fb, nid = fb.negocioId, base = "negocios/" + nid + "/";
  try {
    const listo = F.doc(fs, base + "settings/nombres");
    let revisar = false;
    try { revisar = localStorage.getItem(NOMBRES_REVISAR) === nid; } catch {}
    if (!revisar && (await F.getDoc(listo)).exists()) return;
    const [prods, nombres] = await Promise.all([
      F.getDocsFromServer(F.collection(fs, base + "products")),
      F.getDocsFromServer(F.collection(fs, base + "nombres")),
    ]);
    const existen = new Set(prods.docs.map(d => d.id));
    // una reserva cuenta solo si su producto sigue existiendo
    const usados = new Set(nombres.docs.filter(d => existen.has(d.data().productId)).map(d => d.id));
    const nuevos = [];
    prods.docs.forEach(d => {
      const k = norm(d.data().nombre);
      if (k && !usados.has(k)) { usados.add(k); nuevos.push([k, d.id]); }
    });
    for (let i = 0; i < nuevos.length; i += 400) {
      const b = F.writeBatch(fs);
      nuevos.slice(i, i + 400).forEach(([k, id]) => b.set(F.doc(fs, base + "nombres/" + k), { productId: id }));
      await b.commit();
    }
    await F.setDoc(listo, { reservados: true, fecha: new Date().toISOString() });
    try { if (localStorage.getItem(NOMBRES_REVISAR) === nid) localStorage.removeItem(NOMBRES_REVISAR); } catch {}
  } catch {
    // sin las reglas nuevas o sin conexión: se intenta otra vez la próxima vez
  } finally { nombresRevisando = false; }
}
addEventListener("online", () => setTimeout(nombresReservarExistentes, 2000));

// ---------- inventario ----------
const pendingStock = new Map();
const stockWrites = new Set();
const totalStock = p => Array.isArray(p.variantes) && p.variantes.length ? p.variantes.reduce((a,v)=>a+n2(v.stock),0) : n2(p.stock);
function scheduleStockDelta(id, variantId, delta) {
  const key = id + ":" + (variantId || "");
  const old = pendingStock.get(key);
  if (old) clearTimeout(old.timer);
  // si el guardado anterior ya está en curso, su delta no se vuelve a sumar
  const entry = { delta: (old && !old.promise ? old.delta : 0) + delta, timer: null };
  entry.timer = setTimeout(() => flushStockDelta(key).catch(e => toast(failMsg(e))), 450);
  pendingStock.set(key, entry);
}
async function flushStockDelta(key) {
  const entry = pendingStock.get(key); if (!entry) return;
  if (entry.promise) return entry.promise;
  clearTimeout(entry.timer);
  entry.promise = (async () => {
    const [id, variantId] = key.split(":");
    // en modo local la pantalla y los datos son el mismo objeto: el valor ya está aplicado, solo falta guardarlo
    if (!db) { syncMem(); return; }
    if (usaTransacciones()) { await fbMovimiento({ deltas: new Map([[key, entry.delta]]), piso0: true }); return; }
    const p = await readProduct(id); if (!p) return;
    if (variantId) {
      const v = (p.variantes || []).find(x => x.id === variantId); if (!v) return;
      v.stock = Math.max(0, Math.round((n2(v.stock) + entry.delta) * 1000) / 1000);
      p.stock = totalStock(p);
      await patchProduct(id, { variantes: p.variantes, stock: p.stock, actualizado: new Date().toISOString() });
    } else {
      p.stock = Math.max(0, Math.round((n2(p.stock) + entry.delta) * 1000) / 1000);
      await patchProduct(id, { stock: p.stock, actualizado: new Date().toISOString() });
    }
  })();
  stockWrites.add(entry.promise);
  entry.promise.then(() => stockWrites.delete(entry.promise), () => stockWrites.delete(entry.promise));
  try { await entry.promise; }
  finally { if (pendingStock.get(key) === entry) pendingStock.delete(key); }
}
async function flushPendingStock() {
  while (pendingStock.size || stockWrites.size) {
    const pending = [...pendingStock.keys()].map(key => flushStockDelta(key));
    await Promise.all([...pending, ...stockWrites]);
  }
}
function setStockLocal(id, value) {
  if (!exigir("stock.ajustar", "ajustar stock")) return;
  const p = S.products.find(x => x.id === id); if (!p) return;
  const previous = n2(p.stock);
  p.stock = value;
  scheduleStockDelta(id, null, value - previous);
}
function setVariantStock(id, variantId, value) {
  if (!exigir("stock.ajustar", "ajustar stock")) return;

const TALLAS = {
  Letras: ["XS", "S", "M", "L", "XL", "XXL", "3XL", "Única"],
  Niños: ["2", "4", "6", "8", "10", "12", "14", "16"],
  Pantalón: ["26", "28", "30", "32", "34", "36", "38", "40", "42"],

const COLORES = { Negro: "#1f1f1f", Blanco: "#ffffff", Gris: "#9a9a9a", Azul: "#2f5fd0", "Azul marino": "#1d2a55", Celeste: "#8cc8f0", Rojo: "#d33a2c", Rosado: "#f2a5bd", Fucsia: "#d6338a", Morado: "#7a4cc2", Verde: "#2f9a4f", Amarillo: "#f2cc2f", Naranja: "#f08a24", Beige: "#e3d3b4", Marrón: "#7a4e2d", Plateado: "#c9cdd2", Dorado: "#cfa53a" };
const swatch = c => { const k = Object.keys(COLORES).find(x => norm(x) === norm(c)); return `<i class="sw" style="--sw:${k ? COLORES[k] : "transparent"}"></i>`; };
// orden natural: XS, S, M… luego números de menor a mayor, luego el resto por nombre
function tallaKey(t) {
  const i = TALLAS.Letras.findIndex(x => norm(x) === norm(t));
  if (i >= 0) return [0, i, ""];

}
const byTalla = (a, b) => { const x = tallaKey(a), y = tallaKey(b); return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2]); };
function byColor(a, b) {
  const names = Object.keys(COLORES), i = names.findIndex(x => norm(x) === norm(a)), j = names.findIndex(x => norm(x) === norm(b));
  return (i < 0 ? 99 : i) - (j < 0 ? 99 : j) || norm(a).localeCompare(norm(b));
}
const uniq = list => list.filter((x, i) => x && list.findIndex(y => norm(y) === norm(x)) === i);

}

// El logo se achica a lo que cabe en una ticketera (máx. 400 × 200 px) y se guarda
// dentro de los ajustes como imagen en texto, así viaja a todos los equipos.
async function saveLogo(file) {
  if (!exigir("ajustes.editar", "cambiar el logo")) return;
  if (!/^image\//.test(file.type)) return toast("Elige un archivo de imagen (PNG o JPG).");
  let img;
  try {
    const url = URL.createObjectURL(file);
    img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = url; });
    URL.revokeObjectURL(url);
  } catch { return toast("No se pudo abrir esa imagen."); }
  const k = Math.min(1, 400 / img.naturalWidth, 200 / img.naturalHeight);
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.naturalWidth * k));
  c.height = Math.max(1, Math.round(img.naturalHeight * k));
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); // fondo blanco: el papel del ticket
  g.drawImage(img, 0, 0, c.width, c.height);
  let logo = c.toDataURL("image/png");
  if (logo.length > 150000) logo = c.toDataURL("image/jpeg", 0.85);
  try {
    const s = { ...S.settings, logo };
    await putSettings(s);
    S.settings = s;
    if (configDraft) configDraft.logo = logo;
    toast("Logo guardado. Ya sale en los tickets.");
    renderConfig();
  }
  catch (e) { toast(failMsg(e)); }
}

let pendingBackup = null;
async function importBackup(file) {
  if (!exigir("datos.importar", "importar copias")) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.products) || !Array.isArray(data.notes) || !data.settings || typeof data.settings !== "object" || (data.users !== undefined && !Array.isArray(data.users))) throw new Error("Formato inválido");
    pendingBackup = data;
    const dialog = $("#backupDialog");
    dialog.returnValue = ""; dialog.showModal();
    dialog.onclose = async () => {
      const mode = dialog.returnValue; const incoming = pendingBackup; pendingBackup = null;
      if (!incoming || !["merge", "replace"].includes(mode)) return;
      try {
        if (mode === "replace") {
          if (db) {
            const notasBorrar = await notasCompletas();
            await Promise.all(S.products.map(p => removeProduct(p.id)));
            await Promise.all(notasBorrar.map(n => db.collection("notes").doc(n.id).delete()));
            await Promise.all(S.quotes.map(q => db.collection("quotes").doc(q.id).delete()));
            const cajasBorrar = await cajasCompletas();
            if (!cajasBlocked) await Promise.all(cajasBorrar.map(x => db.collection("cajas").doc(x.id).delete()));
          } else { mem.products.clear(); mem.notes.clear(); mem.quotes.clear(); mem.cajas.clear(); }
        }
        for (const p of incoming.products) if (p && p.id) await putProduct(p);
        // los productos importados no tienen su nombre reservado
        if (usaTransacciones()) { try { localStorage.setItem(NOMBRES_REVISAR, fb.negocioId); } catch {} nombresReservarExistentes(); }
        for (const n of incoming.notes) if (n && n.id) await putNote(n);
        for (const q of Array.isArray(incoming.quotes) ? incoming.quotes : []) if (q && q.id) await putQuote(q);
        if (!cajasBlocked) for (const x of Array.isArray(incoming.cajas) ? incoming.cajas : []) if (x && x.id) await putCaja(x);
        await putSettings(incoming.settings);
        if (Array.isArray(incoming.users) && !fbMode) {
          if (mode === "replace") S.users = incoming.users.filter(u => u && u.id);
          else { const merged = new Map(S.users.map(u => [u.id, u])); incoming.users.filter(u => u && u.id).forEach(u => merged.set(u.id, u)); S.users = [...merged.values()]; }
          await putUsers();
        }
        if (!db) syncMem();
        toast(mode === "replace" ? "Copia importada" : "Copia combinada");
      } catch (err) { toast(failMsg(err)); }
    };
  } catch { toast("No se pudo leer la copia. Elige un JSON de Mostrador."); }
  finally { $("#backupFile").value = ""; }
}

async function saveFile(filename, data) {
  if (!downloads && window.claude) { toast("Descargar no está disponible en esta vista."); return; }
  if (!downloads) {
    // fuera de claude.ai (GitHub Pages o archivo) se descarga con un enlace normal
    const type = /\.xlsx$/i.test(filename) ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : /\.csv$/i.test(filename) ? "text/csv" : /\.html?$/i.test(filename) ? "text/html" : "text/plain";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: type + ";charset=utf-8" }));
    a.download = filename;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return;
  }
  try { await downloads.save({ filename, data }); } catch (e) { if (e && e.code !== "declined") toast("No se pudo descargar el archivo."); }
}

// ---------- diálogo producto ----------
const dlg = $("#dlg");
let editing = null;
let editFoto = ""; // foto del producto que se está editando ("" = sin foto)
// ---------- costo y ganancia ----------
const tieneCosto = p => p && p.costo != null && p.costo !== "";
// muestra en el editor cuánto se gana por unidad al precio de venta
function margenVista() {
  const el = $("#p-margen"), costo = $("#p-costo").value, precio = n2($("#p-precio").value);
  if (costo === "" || !precio) { el.textContent = "Con el costo, Reportes te muestra cuánto ganas."; return; }
  const gana = precio - n2(costo);
  el.textContent = gana >= 0
    ? `Ganas ${money(gana)} por unidad (${Math.round(gana / precio * 100)} % del precio).`
    : `Pierdes ${money(-gana)} por unidad: el costo es mayor que el precio.`;
}
["#p-precio", "#p-costo"].forEach(s => $(s).addEventListener("input", margenVista));
// costo de una línea vendida: el que se guardó al vender; las ventas de antes usan el costo actual del producto
function itemCosto(i) {
  if (i.costo != null) return n2(i.costo);
  const p = i.productId && S.products.find(x => x.id === i.productId);
  return tieneCosto(p) ? n2(p.costo) : null;
}
// ganancia de un grupo de notas emitidas. Los productos sin costo no entran en la cuenta;
// los descuentos (líneas en negativo) sí, porque bajan lo que se ganó.
function gananciaDe(ok) {
  const g = { ingresos: 0, costo: 0, descuentos: 0, sinCosto: 0, lineasSinCosto: 0, productos: new Map() };
  ok.forEach(n => (n.items || []).forEach(i => {
    const monto = n2(i.cant) * n2(i.precio), c = itemCosto(i);
    if (monto < 0) { g.ingresos += monto; g.descuentos += monto; return; }
    if (c == null) { g.sinCosto += monto; g.lineasSinCosto++; return; }
    const costo = n2(i.cant) * c;
    g.ingresos += monto; g.costo += costo;
    const p = i.productId && S.products.find(x => x.id === i.productId);
    const k = i.productId || norm(i.nombre);
    const d = g.productos.get(k) || { nombre: p ? p.nombre : String(i.nombre || "").replace(/\s+–\s+[^–]*$/, ""), cat: p?.categoria || "", unidades: 0, ingresos: 0, costo: 0 };
    d.unidades += n2(i.cant); d.ingresos += monto; d.costo += costo;
    g.productos.set(k, d);
  }));
  g.ganancia = round2(g.ingresos - g.costo);
  g.margen = g.ingresos > 0 ? g.ganancia / g.ingresos * 100 : 0;
  return g;
}

// Tallas y colores del producto que se edita: se eligen tocando; cada combinación es una fila con su stock
const pick = { tallas: [], colores: [], set: "Letras", skip: new Set() };
const comboKey = (t, c) => norm(t || "") + "|" + norm(c || "");
function openVariantEditor(p) {
  const vs = (p && p.variantes) || [];
  pick.tallas = uniq(vs.map(v => v.talla));
  pick.colores = uniq(vs.map(v => v.color));
  pick.skip = new Set();
  // abre el grupo de tallas que más coincide con las del producto
  const [best, hits] = Object.keys(TALLAS).map(k => [k, pick.tallas.filter(t => TALLAS[k].some(x => norm(x) === norm(t))).length]).sort((a, b) => b[1] - a[1])[0];
  pick.set = hits ? best : "Letras";
  $("#p-talla-otra").value = ""; $("#p-color-otro").value = "";
  $("#p-variants").innerHTML = "";
  vs.forEach(v => addVariantEditor(v, true));
  // una combinación que no sale de cruzar las tallas y colores elegidos se trata como hecha a mano
  const all = new Set(combos().map(([t, c]) => comboKey(t, c)));
  const rows = [...$("#p-variants").querySelectorAll("[data-variant-row]")], have = new Set(rows.map(r => comboKey(rowVal(r, "talla"), rowVal(r, "color"))));
  rows.forEach(r => { if (!all.has(comboKey(rowVal(r, "talla"), rowVal(r, "color")))) setLoose(r); });
  // las combinaciones que el producto no tiene no se agregan solas al tocar otra talla o color
  all.forEach(k => { if (!have.has(k)) pick.skip.add(k); });
  pick.masColores = false;
  layoutVariantRows();
  $("#p-variations").open = vs.length > 0;
  renderPick();
}
const rowVal = (r, k) => r.querySelector(`[data-vfield="${k}"]`).value.trim();
function combos() {
  const ts = pick.tallas.length ? pick.tallas : [""], cs = pick.colores.length ? pick.colores : [""];
  return pick.tallas.length || pick.colores.length ? ts.flatMap(t => cs.map(c => [t, c])) : [];
}
function renderPick() {
  // las tallas y colores propios (no de la lista) que se usaron en cualquier producto también aparecen para tocar
  const usadasT = uniq([...pick.tallas, ...S.products.flatMap(p => (p.variantes || []).map(v => v.talla))]).filter(t => !Object.values(TALLAS).flat().some(x => norm(x) === norm(t)));
  const usadasC = uniq([...pick.colores, ...S.products.flatMap(p => (p.variantes || []).map(v => v.color))]).filter(c => !Object.keys(COLORES).some(x => norm(x) === norm(c)));
  const on = (list, x) => list.some(y => norm(y) === norm(x));
  const chip = (kind, x, list, pre = "") => `<button type="button" data-pick="${kind}" data-value="${esc(x)}" aria-pressed="${on(list, x)}">${pre}${esc(x)}</button>`;
  const fuera = pick.tallas.filter(t => !on(TALLAS[pick.set], t) && !on(usadasT, t)); // elegidas de otro grupo: siguen a la vista
  $("#p-tallaset").innerHTML = Object.keys(TALLAS).map(k => `<button type="button" data-tallaset="${esc(k)}" aria-pressed="${k === pick.set}">${esc(k)}</button>`).join("");
  $("#p-tallas").innerHTML = uniq([...TALLAS[pick.set], ...fuera, ...usadasT]).sort(byTalla).map(t => chip("talla", t, pick.tallas)).join("");
  // los colores más comunes, los elegidos y los propios a la vista; el resto detrás de «+ N colores más»
  const todos = [...Object.keys(COLORES), ...usadasC];
  const visibles = pick.masColores ? todos : todos.filter((c, i) => i < 8 || on(pick.colores, c) || usadasC.includes(c));
  const ocultos = todos.length - visibles.length;
  const mas = ocultos ? `<button type="button" class="pick-more" data-pick-more>+ ${ocultos} colores más</button>`
    : pick.masColores ? `<button type="button" class="pick-more" data-pick-more>Menos colores</button>` : "";
  $("#p-colores").innerHTML = visibles.map(c => chip("color", c, pick.colores, swatch(c))).join("") + mas;
  updateVariantSummary();
}
// ordena las filas por color y talla; si algún color tiene varias tallas, las agrupa bajo el color con su total
function layoutVariantRows() {
  const box = $("#p-variants");
  box.querySelectorAll(".var-group").forEach(g => g.remove());
  const rows = [...box.querySelectorAll("[data-variant-row]")];
  const fijas = rows.filter(r => !("loose" in r.dataset))
    .sort((a, b) => byColor(rowVal(a, "color"), rowVal(b, "color")) || byTalla(rowVal(a, "talla"), rowVal(b, "talla")));
  const sueltas = rows.filter(r => "loose" in r.dataset);
  const colores = uniq(fijas.map(r => rowVal(r, "color")));
  const agrupar = colores.some(Boolean) && fijas.length > colores.length;
  box.classList.toggle("agrupado", agrupar);
  const grupo = (html, color) => {
    const g = document.createElement("div");
    g.className = "var-group";
    g.innerHTML = (color ? swatch(color) : "") + `<span>${html}</span><span class="muted" data-group-total></span>`;
    box.append(g);
  };
  let actual = null;
  fijas.forEach(r => {
    const t = rowVal(r, "talla"), c = rowVal(r, "color");
    if (agrupar && norm(c) !== actual) { actual = norm(c); grupo(esc(c || "Sin color"), c); }
    r.querySelector(".var-label").textContent = agrupar ? (t || "Sin talla") : [t, c].filter(Boolean).join(" / ");
    box.append(r);
  });
  if (agrupar && sueltas.length) grupo("Agregadas a mano");
  sueltas.forEach(r => box.append(r));
  $("#p-var-head").firstElementChild.textContent = agrupar ? "Talla" : "Combinación";
  updateVariantSummary();
}
function updateVariantSummary() {
  // total de cada grupo de color
  let g = null;
  const tot = new Map();
  for (const el of $("#p-variants").children) {
    if (el.classList.contains("var-group")) { g = el; tot.set(g, 0); }
    else if (g && "variantRow" in el.dataset) tot.set(g, tot.get(g) + n2(rowVal(el, "stock")));
  }
  tot.forEach((n, el) => { el.querySelector("[data-group-total]").textContent = qty(n) + " und"; });
  const rows = $("#p-variants").querySelectorAll("[data-variant-row]");
  $("#p-var-head").hidden = !rows.length;
  $("#p-var-sum").textContent = rows.length ? `Tallas y colores · ${rows.length} ${rows.length === 1 ? "combinación" : "combinaciones"}` : "Tallas y colores (opcional)";
  // con variantes, el stock del producto es la suma de todas
  const stock = $("#p-stock");
  stock.readOnly = rows.length > 0;
  stock.title = rows.length ? "Es la suma del stock de cada talla y color" : "";
  if (rows.length) stock.value = [...rows].reduce((a, r) => a + n2(rowVal(r, "stock")), 0);
}
// agrega las combinaciones nuevas, quita las de tallas o colores desmarcados y ordena la lista
function syncVariantRows() {
  const box = $("#p-variants"), want = combos().filter(([t, c]) => !pick.skip.has(comboKey(t, c)));
  const wantKeys = new Set(want.map(([t, c]) => comboKey(t, c)));
  let perdido = 0;
  box.querySelectorAll("[data-variant-row]:not([data-loose])").forEach(r => {
    if (!wantKeys.has(comboKey(rowVal(r, "talla"), rowVal(r, "color")))) { if (n2(rowVal(r, "stock"))) perdido++; r.remove(); }
  });
  const have = new Set([...box.querySelectorAll("[data-variant-row]")].map(r => comboKey(rowVal(r, "talla"), rowVal(r, "color"))));
  want.forEach(([talla, color]) => { if (!have.has(comboKey(talla, color))) addVariantEditor({ talla, color, stock: 0 }, true); });
  if (perdido) toast("Se quitaron combinaciones que tenían stock. Si fue un error, toca Cancelar.");
  layoutVariantRows();
}
function setLoose(row) {

async function fotoDesdeArchivo(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight), size = Math.min(240, side);
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, size, size); // las imágenes con fondo transparente quedan sobre blanco
    g.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
    return c.toDataURL("image/jpeg", 0.8);
  } finally { URL.revokeObjectURL(url); }
}

// Crear: los códigos nuevos son EAN-13 de uso interno (empiezan con 20) y sirven solo en esta tienda.
// Dibujar: 13 dígitos válidos van como EAN-13; cualquier otro código sin tildes ni ñ, como Code 128.
const CODE128 = "212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232".split(" ");
const EAN_L = ["0001101", "0011001", "0010011", "0111101", "0100011", "0110001", "0101111", "0111011", "0110111", "0001011"];
const EAN_PARIDAD = ["LLLLLL", "LLGLGG", "LLGGLG", "LLGGGL", "LGLLGG", "LGGLLG", "LGGGLL", "LGLGLG", "LGLGGL", "LGGLGL"];
function eanDigito(cuerpo) {
  const suma = [...cuerpo].reduce((a, d, i) => a + Number(d) * (i % 2 ? 3 : 1), 0);
  return String((10 - suma % 10) % 10);
}
